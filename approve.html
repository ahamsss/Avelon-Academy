<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your class — Avelon Academy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F7F7F5;color:#0B0D12;line-height:1.55;-webkit-font-smoothing:antialiased}
.box{max-width:480px;margin:60px auto;padding:30px;background:#FFFFFF;border:1px solid #E2E2DD;border-radius:20px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Inter Tight",Inter,sans-serif;font-weight:800;font-size:19px;margin-bottom:24px;color:#0B0D12;text-decoration:none}
h1{font-family:"Inter Tight",Inter,sans-serif;font-weight:800;font-size:30px;letter-spacing:-.03em;margin:0 0 10px;line-height:1.15}
p{color:#5A5F6E}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:90px;padding:12px;border:1px solid #E2E2DD;border-radius:12px;margin:8px 0 14px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;padding:12px 22px;min-height:46px;border:1.5px solid #0B0D12;background:transparent}
button.primary{background:#2563EB;border-color:#2563EB;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="box">
<a class="logo" href="index.html"><svg aria-hidden="true" width="28" height="27" viewBox="4 6 92 88"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="#B8923A" stroke-width="4.5" d="M24.1 89.6 L91.8 40.4 M8.2 40.4 L75.9 89.6"/><path stroke="#111111" stroke-width="9" d="M24.1 89.6 L50 10 L75.9 89.6 M8.2 40.4 H91.8"/></g></svg>Avelon Academy</a>
<div id="out"><p>Loading…</p></div>
</div>
<script>
// ====== SETTINGS: same values as portal/index.html ======
var SUPABASE_URL = "https://roqrfckvwsnghifetrld.supabase.co";
var SUPABASE_KEY = "sb_publishable_6gPI6D0fiGBwlG-D3yF3qQ_8uZxlW9x";
// ========================================================
var out = document.getElementById("out");
var q = new URLSearchParams(location.search);
var token = q.get("t"), action = q.get("a");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function api(body){
  return fetch(SUPABASE_URL + "/functions/v1/approve-session", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}
function done(d){
  if (d.error) { out.innerHTML = "<h1>Hmm.</h1><p>" + esc(d.error) + "</p>"; return; }
  var what = esc(d.student) + "'s " + d.minutes + "-minute class on " + esc(d.date);
  if (d.status === "approved") out.innerHTML = "<h1>Thanks, class confirmed.</h1><p>" + what + " is confirmed. See notes and homework any time in the <a href='portal/'>portal</a>.</p>";
  else if (d.status === "flagged") out.innerHTML = "<h1>Thanks for telling us.</h1><p>We've paused " + what + " and won't charge it until we've sorted it out. We'll be in touch.</p>";
  else if (d.status === "void") out.innerHTML = "<h1>No action needed.</h1><p>" + what + " won't be charged.</p>";
  else showChoice(d);
}
function showChoice(d){
  var what = esc(d.student) + "'s " + d.minutes + "-minute class on " + esc(d.date);
  out.innerHTML = "<h1>Confirm this class?</h1><p>" + what + ".</p><div class='actions'><button class='primary' id='yes'>Yes, confirm class</button><button id='no'>Something's wrong</button></div>";
  document.getElementById("yes").onclick = function(){ api({token: token, action: "approve"}).then(done); };
  document.getElementById("no").onclick = function(){ showFlag(d); };
}
function showFlag(d){
  out.innerHTML = "<h1>What went wrong?</h1><p>" + esc(d.student) + "'s class on " + esc(d.date) + ". We won't charge it until we've sorted it out.</p>" +
    "<label for='why' style='font-weight:600'>Tell us briefly</label><textarea id='why' placeholder='e.g. The class was only 30 minutes'></textarea>" +
    "<div class='actions'><button class='primary' id='send'>Send</button><button id='back'>Back</button></div>";
  document.getElementById("send").onclick = function(){
    api({token: token, action: "flag", reason: document.getElementById("why").value}).then(function(r){ if (r.error) { alert(r.error); return; } done(r); });
  };
  document.getElementById("back").onclick = function(){ showChoice(d); };
}
if (!token) { out.innerHTML = "<h1>Link not valid</h1><p>Please use the link from your email.</p>"; }
else {
  api({token: token, action: "view"}).then(function(d){
    if (d.error || d.status !== "pending") return done(d);
        if (action === "flag") return showFlag(d);
    showChoice(d);
  }).catch(function(){ out.innerHTML = "<h1>Couldn't connect</h1><p>Please try again in a moment.</p>"; });
}
</script>
</body>
</html>
