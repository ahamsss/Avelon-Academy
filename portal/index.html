    return `<tr><td><b>${esc(fmtWhen(t))}</b>${live ? ' <span class="pill ok">Starting now</span>' : ""}</td><td>${esc(k.first_name)}<div class="note">${esc([k.grade, k.subject].filter(Boolean).join(" · "))}${extra ? "<br>" + extra : ""}</div></td><td>${s.minutes} min</td>
      <td>${s.meet_link ? `<a class="btnlink${live ? " go" : ""}" href="${esc(s.meet_link)}" target="_blank" rel="noopener">Join Google Meet</a>` : `<span class="note">Meet link coming</span>`}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}
function slotsHtml(k, slots, canEdit) {
  const mine = slots.filter((s) => s.student_id === k.id);
  const rows = mine.map((s) => `<li><b>${DAYS[s.weekday]}s, ${esc(s.start_time.slice(0, 5))}</b> <span class="note">${esc(zoneName(s.timezone))} time · ${s.minutes} min</span><br>
    ${s.meet_link ? `<a href="${esc(s.meet_link)}" target="_blank" rel="noopener">Google Meet link</a>` : `<span class="note">No Meet link yet</span>`} · <a href="${esc(gcalLink(s, k.first_name))}" target="_blank" rel="noopener">Add to Google Calendar</a>
    ${canEdit ? `<div class="actions" style="margin-top:6px"><button class="small" data-editlink="${s.id}" data-link="${esc(s.meet_link || "")}" type="button">${s.meet_link ? "Change" : "Add"} Meet link</button><button class="small" data-delslot="${s.id}" type="button">Remove</button></div>` : ""}</li>`).join("");
  const form = canEdit ? `<details style="margin-top:10px"><summary>Add a weekly class time</summary><form class="form slotform" data-student="${k.id}" style="margin-top:12px"><div class="row">
      <label>Day<select name="weekday">${DAYS.map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select></label>
      <label>Start time<input name="start_time" type="time" required value="17:00"></label>
      <label>Length<select name="minutes">${[30, 45, 60, 75, 90, 120].map((m) => `<option value="${m}" ${m === 60 ? "selected" : ""}>${m} min</option>`).join("")}</select></label>
      <label>Time zone<select name="timezone">${ZONES.map(([z, n]) => `<option value="${z}" ${z === DEF_ZONE ? "selected" : ""}>${n}</option>`).join("")}</select></label></div>
      <label>Google Meet link <span class="note">(optional now, you can add it later)</span><input name="meet_link" type="url" placeholder="https://meet.google.com/abc-defg-hij"></label>
      <button class="small primary" type="submit">Add weekly class</button></form></details>` : "";
  return `<div class="block"><h3>Weekly schedule</h3>${rows ? `<ul class="plain">${rows}</ul>` : `<p class="note">No class time set yet.</p>`}${form}</div>`;
}
const FILE_NOTE = `<div class="msg info" style="margin:8px 0 12px;font-size:14px">Files are deleted automatically 3 months after upload. Download anything you want to keep.</div>`;
function filesHtml(k, files, me) {
  const mine = files.filter((f) => f.student_id === k.id);
  const rows = mine.map((f) => {
    const left = Math.max(0, 90 - Math.floor((Date.now() - Date.parse(f.created_at)) / 864e5));
    return `<li><a href="#" data-dl="${esc(f.path)}" data-name="${esc(f.file_name)}">${esc(f.file_name)}</a>
      <span class="note">${(f.size_bytes / 1048576).toFixed(1)} MB · ${new Date(f.created_at).toLocaleDateString("en-CA")} · <span${left <= 14 ? ' style="color:var(--warn);font-weight:600"' : ""}>deleted in ${left} day${left === 1 ? "" : "s"}</span></span>
      ${f.uploaded_by === me.id || me.role === "admin" ? ` <button class="small" data-delfile="${f.id}" data-path="${esc(f.path)}" type="button">Delete</button>` : ""}</li>`;
  }).join("");
  return `<div class="block"><h3>Files</h3>${FILE_NOTE}${rows ? `<ul class="plain">${rows}</ul>` : `<p class="note">No files yet.</p>`}
    <label class="upload">Upload a file <span class="note">(PDF, Word, PowerPoint, images; max 10 MB)</span><input type="file" data-up="${k.id}" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.png,.jpg,.jpeg,.heic,.zip"></label></div>`;
}
function bindShared(me) {
  app.querySelectorAll(".slotform").forEach((f) => f.onsubmit = async (e) => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(f));
    const { error } = await sb.from("class_slots").insert({ student_id: f.dataset.student, weekday: +d.weekday, start_time: d.start_time, minutes: +d.minutes, timezone: d.timezone, meet_link: d.meet_link.trim() || null });
    show(error ? (error.message.includes("meet_link") ? "The Meet link must start with https://" : error.message) : "Weekly class added.", error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-delslot]").forEach((b) => b.onclick = async () => {
    if (!confirm("Remove this weekly class time?")) return;
    const { error } = await sb.from("class_slots").delete().eq("id", b.dataset.delslot);
    show(error ? error.message : "Class time removed.", error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-editlink]").forEach((b) => b.onclick = async () => {
    const v = prompt("Paste the Google Meet link (starts with https://)", b.dataset.link); if (v === null) return;
    const { error } = await sb.from("class_slots").update({ meet_link: v.trim() || null }).eq("id", b.dataset.editlink);
    show(error ? "The Meet link must start with https://" : "Meet link saved.", error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-up]").forEach((inp) => inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    if (!file.size) return show("That file is empty.", "bad");
    if (file.size > 10 * 1048576) return show("That file is over 10 MB. Try a smaller file, or share a Google Drive link instead.", "bad");
    const safe = file.name.replace(/[^\w.\- ]+/g, "_").slice(-120);
    const path = `${inp.dataset.up}/${crypto.randomUUID()}-${safe}`;
    inp.disabled = true;
    const { error: upErr } = await sb.storage.from("class-files").upload(path, file, { contentType: file.type || "application/octet-stream" });
    if (upErr) { inp.disabled = false; return show(upErr.message, "bad"); }
    const { error } = await sb.from("class_files").insert({ student_id: inp.dataset.up, file_name: file.name.slice(0, 200), path, size_bytes: file.size });
    show(error ? error.message : `${file.name} uploaded.`, error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-dl]").forEach((a) => a.onclick = async (e) => {
    e.preventDefault();
    const { data, error } = await sb.storage.from("class-files").createSignedUrl(a.dataset.dl, 120, { download: a.dataset.name });
    if (error) return show(error.message, "bad");
    location.href = data.signedUrl;
  });
  app.querySelectorAll("[data-delfile]").forEach((b) => b.onclick = async () => {
    if (!confirm("Delete this file for everyone?")) return;
    await sb.storage.from("class-files").remove([b.dataset.path]);
    const { error } = await sb.from("class_files").delete().eq("id", b.dataset.delfile);
    show(error ? error.message : "File deleted.", error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-group]").forEach((c) => c.onchange = async () => {
    const { error } = await sb.from("students").update({ open_to_group: c.checked }).eq("id", c.dataset.group);
    show(error ? error.message : c.checked ? "Noted: open to a small group. We'll let you know if we find a match." : "Okay, one-on-one only.", error ? "bad" : "ok");
  });
}

        <div class="row"><label>First name<input name="first_name" required></label>

  };
  document.getElementById("me").onsubmit = async (e) => {

  const tutors = (people || []).filter((p) => p.role === "tutor");
  const parents = (people || []).filter((p) => p.role === "parent");
  const admins = (people || []).filter((p) => p.role === "admin");
  const open = (classes || []).filter((c) => c.status === "flagged" || c.status === "pending");
  const who = (p) => esc(p?.full_name || p?.email || "");
  const roleSel = (p) => `<select data-role="${p.id}" style="width:auto">${["parent", "tutor", "admin"].map((r) => `<option ${r === p.role ? "selected" : ""}>${r}</option>`).join("")}</select>`;

  // Trial requests
  const reqRows = (reqs || []).map((r) => `<tr><td>${new Date(r.created_at).toLocaleDateString("en-CA")}</td><td><b>${esc(r.parent_name)}</b><div class="note"><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></div></td><td>${esc(r.grade)}<div class="note">${esc(r.subject)} · ${esc(r.format || "One-on-one")}</div></td>
    <td><select data-req="${r.id}" style="width:auto">${["new", "contacted", "booked", "closed"].map((x) => `<option ${x === r.status ? "selected" : ""}>${x}</option>`).join("")}</select></td></tr>`).join("");
  const newReqs = (reqs || []).filter((r) => r.status === "new").length;

  // Classes needing attention
  const openRows = open.map((c) => `<tr><td>${esc(c.class_date)}</td><td>${esc(K[c.student_id]?.first_name || "")}</td><td>${who(P[c.tutor_id])}</td><td>${c.minutes} min · ${money(c.amount_cents)}</td>
    <td>${pill(c.status)}${c.flag_reason ? `<div class="note">${esc(c.flag_reason)}</div>` : ""}<div class="actions" style="margin-top:6px"><button class="small" data-set="approved" data-id="${c.id}" type="button">Approve</button><button class="small" data-set="void" data-id="${c.id}" type="button">Don't charge</button></div></td></tr>`).join("");

  // Students
  const groups = {};
  for (const k of kids || []) if (k.open_to_group && k.active) (groups[`${k.grade || "?"} · ${k.subject || "?"}`] ||= []).push(k.first_name);
  const matchable = Object.entries(groups).filter(([, n]) => n.length >= 2);
  const kidRows = (kids || []).map((k) => `<tr data-kid="${k.id}">
    <td><b>${esc(k.first_name)}</b>${k.open_to_group ? ' <span class="pill blue">Open to group</span>' : ""}<div class="note">${esc(k.grade || "")} · ${esc(k.subject || "")}<br>Parent: ${who(P[k.parent_id])}${P[k.parent_id]?.card_last4 ? " · card ✓" : " · no card"}${k.student_email ? `<br>Student email: ${esc(k.student_email)}` : ""}</div></td>
    <td><select name="tutor"><option value="">none</option>${tutors.map((t) => `<option value="${t.id}" ${t.id === k.tutor_id ? "selected" : ""}>${esc(t.full_name || t.email)}</option>`).join("")}</select></td>
    <td><input name="rate" type="number" min="0" step="0.5" style="width:96px" value="${k.rate_cents != null ? (k.rate_cents / 100) : ""}" placeholder="$/hr"></td>
    <td><select name="trial">${["trial", "continuing", "ended"].map((t) => `<option ${t === k.trial_status ? "selected" : ""}>${t}</option>`).join("")}</select></td>
    <td><input name="active" type="checkbox" ${k.active ? "checked" : ""} aria-label="Active" style="width:auto"></td>
    <td><button class="small" data-savekid type="button">Save</button></td></tr>`).join("");

  // Parents and tutors
  const parentRows = parents.map((p) => {
    const ch = (kids || []).filter((k) => k.parent_id === p.id);
    return `<tr><td><b>${esc(p.full_name || "")}</b><div class="note"><a href="mailto:${esc(p.email)}">${esc(p.email)}</a>${p.phone ? " · " + esc(p.phone) : ""}</div></td>
      <td>${ch.map((k) => esc(k.first_name)).join(", ") || '<span class="note">none yet</span>'}</td><td>${p.card_last4 ? "✓ •••• " + esc(p.card_last4) : '<span class="note">none</span>'}</td><td>${roleSel(p)}</td></tr>`;
  }).join("");
  const tutorRows = tutors.concat(admins.filter((a) => (kids || []).some((k) => k.tutor_id === a.id))).map((t) => {
    const st = (kids || []).filter((k) => k.tutor_id === t.id && k.active);
    return `<tr><td><b>${esc(t.full_name || "")}</b><div class="note"><a href="mailto:${esc(t.email)}">${esc(t.email)}</a>${t.phone ? " · " + esc(t.phone) : ""}</div></td>
      <td>${st.map((k) => `${esc(k.first_name)} <span class="note">(${esc(k.grade || "")} ${esc(k.subject || "")})</span>`).join("<br>") || '<span class="note">no students yet</span>'}</td><td>${roleSel(t)}</td></tr>`;
  }).join("");

  const payRows = (pays || []).map((c) => `<tr><td>${new Date(c.created_at).toLocaleDateString("en-CA")}</td><td>${who(P[c.parent_id])}</td><td>${money(c.amount_cents)}</td><td>${pill(c.status)}${c.failure_message ? `<div class="note">${esc(c.failure_message)}</div>` : ""}</td></tr>`).join("");

  const bar = (used, total, label) => { const pct = Math.min(100, Math.round((used / total) * 100)); return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${label}</span><span>${(used / 1048576).toFixed(0)} MB of ${total >= 1073741824 ? "1 GB" : (total / 1048576) + " MB"} · <b>${pct}%</b></span></div><div style="height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px"><div style="height:100%;width:${Math.max(pct, 1)}%;background:${pct >= 75 ? "var(--warn)" : "var(--navy)"}"></div></div></div>`; };
  const usageHtml = usage ? bar(usage.db_bytes, 500 * 1048576, "Database") + bar(usage.file_bytes, 1073741824, `Class files (${usage.file_count})`) : `<p class="note">Couldn't load usage.</p>`;

  hero("Admin", 'Avelon <span class="star">HQ.</span>', "Trial requests, schedules, tutors, families and billing in one place.");
  app.innerHTML = `
    ${flash}
    <nav class="jump">${[["requests", "Trial requests"], ["week", "This week"], ["attention", "Needs attention"], ["students", "Students"], ["schedules", "Schedules & files"], ["tutors", "Tutors"], ["parents", "Parents"], ["billing", "Billing"], ["storage", "Storage"]].map(([id, t]) => `<a href="#${id}">${t}</a>`).join("")}</nav>
    <div class="panel" id="requests"><h2>Trial requests${newReqs ? ` <span class="pill blue">${newReqs} new</span>` : ""}</h2><p class="note">From the "Start with 3 trial classes" form on the homepage. Each family already got the welcome email.</p><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Parent</th><th>Child</th><th>Status</th></tr></thead><tbody>${reqRows || `<tr><td colspan="4" class="note">No requests yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="week"><h2>This week</h2>${upcomingHtml(sf.slots, K, { days: 7, empty: "No classes scheduled this week.", extra: (k) => "Tutor: " + (who(P[k.tutor_id]) || "none") })}</div>
    <div class="panel" id="attention"><h2>Classes needing attention (${open.length})</h2><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Student</th><th>Tutor</th><th>Class</th><th>Status</th></tr></thead><tbody>${openRows || `<tr><td colspan="5" class="note">Nothing to review.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="students"><h2>Students (${(kids || []).length})</h2><p class="note">Set the tutor and hourly price for each student. Tutors can only log classes once both are set. Founding families (first 10): $25/hour one-on-one; small group and Bangla: $20/hour.</p>
      ${matchable.length ? `<div class="msg info">Possible small groups: ${matchable.map(([g, n]) => `<b>${esc(g)}</b> (${n.map(esc).join(", ")})`).join("; ")}</div>` : ""}
      <div class="scroll"><table class="table"><thead><tr><th>Student</th><th>Tutor</th><th>$/hour</th><th>Trial</th><th>Active</th><th></th></tr></thead><tbody>${kidRows || `<tr><td colspan="6" class="note">No students yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="schedules"><h2>Schedules &amp; files</h2><p class="note">Set each student's weekly class time and Google Meet link. The family, the student and the tutor all see it.</p>
      ${(kids || []).filter((k) => k.active).map((k) => `<details class="kidbox"><summary><b>${esc(k.first_name)}</b> <span class="note">${esc([k.grade, k.subject].filter(Boolean).join(" · "))} · tutor: ${who(P[k.tutor_id]) || "none"} · ${sf.slots.filter((s) => s.student_id === k.id).length} weekly class(es)</span></summary>${slotsHtml(k, sf.slots, true)}${filesHtml(k, sf.files, me)}</details>`).join("") || `<p class="note">No students yet.</p>`}</div>
    <div class="panel" id="tutors"><h2>Tutors (${tutors.length})</h2><p class="note">To add a tutor: they sign up at avelonacademy.ca/portal, then you change their role to "tutor" in the Parents list below.</p><div class="scroll"><table class="table"><thead><tr><th>Tutor</th><th>Students</th><th>Role</th></tr></thead><tbody>${tutorRows || `<tr><td colspan="3" class="note">No tutors yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="parents"><h2>Parents (${parents.length})</h2><p class="note">Everyone who signs up starts here as a parent.</p><div class="scroll"><table class="table"><thead><tr><th>Parent</th><th>Children</th><th>Card</th><th>Role</th></tr></thead><tbody>${parentRows || `<tr><td colspan="4" class="note">No parents yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="billing"><h2>Billing</h2><p class="note">Billing runs automatically every Monday. Use this to run it now (for example after fixing a failed card).</p><button id="bill" class="primary" type="button">Charge all confirmed classes now</button>
      <h3 style="margin-top:26px">Payments</h3><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Parent</th><th>Amount</th><th>Status</th></tr></thead><tbody>${payRows || `<tr><td colspan="4" class="note">No payments yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="storage"><h2>Storage</h2>${usageHtml}<p class="note">Free plan limits. Class files are deleted automatically 3 months after upload. If either bar passes 75%, you'll get an email on Monday.</p></div>`;
  flash = "";

  document.getElementById("bill").onclick = async (e) => {
    if (!confirm("Charge every family's card now for all confirmed, unbilled classes?")) return;
    e.target.disabled = true;
    try { const r = await call("weekly-billing"); show(`Charged ${r.charged.length}, failed ${r.failed.length}, no card ${r.noCard.length}.`); }
    catch (err) { show(err.message, "bad"); }
  };
  app.querySelectorAll("[data-set]").forEach((b) => b.onclick = async () => {
    try { await rpc("admin_set_session", { p_session: b.dataset.id, p_status: b.dataset.set }); show("Updated."); }
    catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-savekid]").forEach((b) => b.onclick = async () => {
    const tr = b.closest("tr"); const g = (n) => tr.querySelector(`[name=${n}]`);
    const rate = g("rate").value === "" ? null : Math.round(Number(g("rate").value) * 100);
    try { await rpc("admin_update_student", { p_student: tr.dataset.kid, p_tutor: g("tutor").value || null, p_rate_cents: rate, p_trial_status: g("trial").value, p_active: g("active").checked }); show("Student saved."); }
    catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-req]").forEach((sel) => sel.onchange = async () => {
    const { error } = await sb.from("trial_requests").update({ status: sel.value }).eq("id", sel.dataset.req);
    show(error ? error.message : "Request updated.", error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-role]").forEach((s) => s.onchange = async () => {
    if (s.value === "admin" && !confirm("Give this person full admin access, including all families and payments?")) { route(); return; }
    try { await rpc("admin_set_role", { p_user: s.dataset.role, p_role: s.value }); show("Role updated."); }
    catch (err) { show(err.message, "bad"); }
  });
  bindShared(me);
}

// ---------------- Router ----------------
async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: me, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !me) { app.innerHTML = `<div class="msg bad">Couldn't load your account. Try signing out and in again.</div>`; return; }
  document.getElementById("who").textContent = me.email;
  const so = document.getElementById("signout"); so.classList.remove("hidden");
  so.onclick = async () => { await sb.auth.signOut(); loginView(); };
  try {
    if (me.role === "admin") await adminView(me);
    else if (me.role === "tutor") await tutorView(me);
    else {
      const { data: linked } = await sb.from("students").select("*");
      const own = (linked || []).filter((k) => k.parent_id === me.id), asStudent = (linked || []).filter((k) => k.parent_id !== me.id);
      if (!own.length && asStudent.length) await studentView(me, asStudent);
      else await parentView(me);
    }
  } catch (err) { app.innerHTML = `<div class="msg bad">${esc(err.message)}</div>`; }
}
sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT") route(); });
route();
</script>
</body>
</html>
