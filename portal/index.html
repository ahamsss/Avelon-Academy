<style>
:root{color-scheme:only light}
:root{--ink:#0B0D12;--paper:#F1F1EE;--soft:#E7E7E2;--card:#FFFFFF;--muted:#5A5F6E;--line:#E2E2DD;--gold:#E0B354;--gold-deep:#B8923A;--navy:#0E1528;--navy-2:#111A38;--night:#08090D;--blue-text:#1D4ED8;--blue-light:#60A5FA;--ok:#15803D;--warn:#B45309;--bad:#B91C1C}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--blue-text)}
.display,h1,h2{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.03em}
/* header: same as the homepage */
header{background:var(--night);color:#F3EFE6;border-bottom:1px solid #1A2033;position:sticky;top:0;z-index:20}
.bar{max-width:1180px;margin:0 auto;padding:0 28px;min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#F3EFE6;font-family:"Inter Tight",Inter,sans-serif;font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.hdr{display:flex;gap:18px;align-items:center;font-size:15px}
.hdr a{color:#F3EFE6;text-decoration:none;font-weight:500}.hdr a:hover{color:#93C5FD}
#who{color:#A3ACBF;font-size:14px}
header button{border-color:#60A5FA;background:#60A5FA;color:#0B0D12}header button:hover{background:#93C5FD;border-color:#93C5FD}
@media (max-width:640px){#who,.hdr .back{display:none}.logo{font-size:18px}}
/* night band with the page title */
.sky{position:relative;overflow:hidden;background:linear-gradient(165deg,var(--night) 0%,#121A2E 100%);color:#fff}
.sky .in{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:64px 28px 120px}
.label{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#93C5FD;margin:0 0 14px}
.sky h1{font-weight:700;font-size:clamp(40px,6vw,76px);line-height:1;margin:0 0 16px}
.sky h1 .star{color:var(--gold)}
.sky p.sub{color:#C3CBDD;font-size:18px;max-width:560px;margin:0}

x 2px at 52.0% 67.2%,rgba(255,255,255,0.53),transparent),radial-gradient(1px 1px at 82.9% 27.8%,rgba(255,255,255,0.72),transparent),radial-gradient(1px 1px at 28.1% 35.4%,rgba(255,255,255,0.70),transparent),radial-gradient(1.5px 1.5px at 40.5% 19.0%,rgba(255,255,255,0.48),transparent),radial-gradient(1px 1px at 14.1% 4.7%,rgba(255,255,255,0.60),transparent),radial-gradient(1.5px 1.5px at 63.0% 65.5%,rgba(224,179,84,.9),transparent),radial-gradient(1px 1px at 95.8% 68.4%,rgba(255,255,255,0.80),transparent),radial-gradient(2px 2px at 25.6% 71.4%,rgba(255,255,255,0.64),transparent),radial-gradient(1.5px 1.5px at 3.6% 22.6%,rgba(255,255,255,0.65),transparent);animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
main{flex:1;width:100%;max-width:1180px;margin:-72px auto 0;padding:0 28px 90px;position:relative;z-index:2}
h2{font-weight:700;font-size:24px;margin:0 0 14px}
.sub{color:var(--muted);margin:0 0 26px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;margin-bottom:22px;box-shadow:0 1px 2px rgba(11,13,18,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.grid{margin-bottom:22px}.grid .panel{margin-bottom:0}.panel .grid{margin-bottom:0}
.form button{justify-self:start}.login .form button{justify-self:stretch}
label .note{display:inline;font-weight:400}
.kid{background:var(--soft)!important;border-color:transparent!important}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-weight:400;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-light);outline-offset:1px}
.form{display:grid;gap:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.row label:not(.check){display:grid;grid-template-columns:auto minmax(0,1fr);align-content:start;align-items:baseline;column-gap:5px;row-gap:6px}
.row label:not(.check)>input,.row label:not(.check)>select,.row label:not(.check)>textarea{grid-column:1/-1}
.row label .note{font-weight:400}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;padding:10px 20px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);min-height:46px;transition:background .25s,color .25s,border-color .25s}
button:hover{background:var(--navy);color:#fff}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button.primary:hover{background:var(--navy-2);border-color:var(--navy-2)}
button.small{min-height:36px;padding:5px 14px;font-size:14px}
button.lk{min-height:0;padding:4px 9px;border:0;border-radius:8px;font-size:13px;font-weight:600;color:var(--blue-text);background:transparent}
button.lk:hover{background:#E9EEF8;color:var(--navy)}
button.lk.red{color:var(--bad)}button.lk.red:hover{background:#FEE2E2;color:var(--bad)}
button.ed{min-height:0;padding:1px 5px;margin-left:2px;border:0;border-radius:6px;font-size:13px;line-height:1.2;color:var(--muted);background:transparent;vertical-align:1px}
button.ed:hover{background:var(--soft);color:var(--navy)}
.acts{display:flex;gap:2px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
#students .table td:first-child{min-width:175px}
.subline{font-size:16px;font-weight:600;color:var(--ink);margin:8px 0 6px}.with{font-weight:500;color:var(--muted)}.dot{color:var(--muted);margin:0 8px}
.subblock{border-top:1px solid var(--line);margin-top:14px;padding-top:18px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:999px;padding:4px;gap:4px;margin:12px 0 0}.seg button{min-height:0;border:0;padding:7px 18px;font-size:14px;border-radius:999px;color:var(--ink);background:transparent}.seg button:hover{background:#fff;color:var(--ink)}.seg button.on{background:var(--navy);color:#fff}.subhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.subhead h3{margin:0;font-size:20px}
.table tr.more td{border-bottom:1px dashed var(--line)}.table tr.cont td{padding-top:8px}
.addsub td{background:var(--soft)}.addsub .acts{justify-content:flex-start;gap:8px;flex-wrap:wrap}.addsub select{max-width:220px}.addsub select,.addsub input{width:auto;padding:7px 10px;font-size:14px;border-radius:8px}
.mwrap{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}.mwrap.one{grid-template-columns:1fr}
@media(max-width:760px){.mwrap{grid-template-columns:1fr}}
.mside{display:flex;flex-direction:column;gap:8px}.mside .msearch,.mside .mnew{padding:8px 12px;font-size:14px;border-radius:10px}
.mlist{display:flex;flex-direction:column;gap:4px;max-height:380px;overflow:auto}
.mthread{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;min-height:0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:400}
.mthread:hover{background:var(--soft);color:var(--ink)}.mthread.on{border-color:var(--navy);background:var(--soft)}
.mthread .mt{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mthread .ms{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mthread .cnt{background:var(--blue-text);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.mconv{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.mhead{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.mscroll{padding:16px;max-height:380px;min-height:150px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mb{max-width:78%;align-self:flex-start;background:var(--soft);border-radius:14px 14px 14px 4px;padding:9px 13px}
.mb.me{align-self:flex-end;background:var(--navy);color:#fff;border-radius:14px 14px 4px 14px}.mb.me .mh span{color:#C3CBDD}
.mb.fl{outline:2px solid #F59E0B}
.mh{font-size:12px;font-weight:700;margin-bottom:3px}.mh span{font-weight:500;color:var(--muted)}
.mx{font-size:15px;line-height:1.5;white-space:normal;overflow-wrap:anywhere}
.mfl{font-size:12px;color:var(--warn);margin-top:6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.mfl.quiet{justify-content:flex-end;margin-top:2px}.mb.me .mfl .lk{color:#FCA5A5}
.msend{display:flex;gap:10px;align-items:flex-end;padding:12px;border-top:1px solid var(--line)}.msend textarea{min-height:46px;resize:vertical;flex:1}
.mnote{padding:0 14px 12px;margin:0;font-size:12.5px}
.ef{display:flex;gap:6px;margin:0 0 6px}.ef input,.ef select{padding:7px 10px;font-size:14px;border-radius:8px}.ef input[name=first_name]{min-width:0;flex:1}.ef select[name=grade]{width:auto}
.table tr.editing td{background:#FAFAF8}.table tr.editfoot td{background:#FAFAF8;padding-top:6px}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.price{background:var(--soft);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}.price b{font-size:26px;letter-spacing:-.5px}.price span{font-size:13px;color:var(--muted)}.price em{font-style:normal;font-weight:600;margin-top:6px}
.gs{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}
.saved{font-size:13px;font-weight:600;color:var(--muted);min-width:62px;text-align:right;margin-right:4px}.saved.ok{color:var(--ok)}.saved.bad{color:var(--bad)}
.acts select{width:auto;padding:5px 10px;font-size:13px;border-radius:8px;margin-right:4px}
.table select.fit{min-width:140px;padding:8px 10px}.table input.fit{padding:8px 10px}
button:disabled{opacity:.5;cursor:default}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line)}
.table td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--soft);color:var(--ink)}
.pill.ok{background:#DCFCE7;color:var(--ok)}.pill.warn{background:#FEF3C7;color:var(--warn)}.pill.bad{background:#FEE2E2;color:var(--bad)}.pill.blue{background:#E9EEF8;color:var(--blue-text)}
.note{font-size:14px;color:var(--muted)}
.msg{padding:14px 18px;border-radius:14px;margin-bottom:22px;font-weight:500}
.msg.ok{background:#DCFCE7;color:var(--ok)}.msg.bad{background:#FEE2E2;color:var(--bad)}.msg.info{background:#E9EEF8;color:var(--blue-text)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none}
.login{max-width:480px;margin:0 auto}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
footer{background:var(--navy);color:#A3ACBF;font-size:14px}
footer .in{max-width:1180px;margin:0 auto;padding:28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer a{color:#F3EFE6;text-decoration:none}footer a:hover{color:#93C5FD}

.btnlink{display:inline-flex;align-items:center;min-height:36px;padding:5px 16px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.btnlink:hover{background:var(--navy-2)}.btnlink.go{background:#15803D}
label.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:500;margin:6px 0 4px}label.check input{width:auto;margin-top:3px}
.block{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.block h3{font-size:15px;margin:0 0 6px;font-family:"Inter Tight",Inter,sans-serif}
ul.plain{list-style:none;margin:6px 0 0;padding:0}ul.plain li{padding:8px 0;border-bottom:1px solid var(--line)}ul.plain li:last-child{border-bottom:none}
label.upload{margin-top:10px}label.upload input{padding:10px;background:var(--soft);border-style:dashed}
details.kidbox{border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:10px 0;background:#fff}details.kidbox[open]{background:var(--paper)}details.kidbox summary{cursor:pointer}
nav.jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}nav.jump a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink)}nav.jump a:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{scroll-margin-top:90px}

/* Admin dashboard: sidebar + one section at a time, below the navy band */
body.dashmode .sky .in{padding-bottom:56px}
body.dashmode main{margin-top:28px}
.dash{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:2px}
.side .tab{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer}
.side .tab:hover{background:var(--soft)}
.side .tab.on{background:var(--navy);color:#fff}
.side .tab:focus-visible{outline:2px solid var(--blue-light)}
.cnt{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#E9EEF8;color:var(--blue-text);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.side .tab.on .cnt{background:#60A5FA;color:#0B0D12}
.dmain > .panel{display:none;margin-bottom:0}
.dmain > .panel.on{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:6px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--paper);display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--navy)}
.tile.sm b{font-size:19px;line-height:1.25;letter-spacing:-.01em}

.tile b{font-family:"Inter Tight",Inter,sans-serif;font-size:34px;letter-spacing:-.03em;line-height:1}
.tile span{color:var(--muted);font-size:14px}
.tile.warn{background:#FEF3C7;border-color:#FCD34D}
@media (max-width:900px){

function zparts(ms, tz) {

function zonedToUtc(y, m, d, hh, mm, tz) { const guess = Date.UTC(y, m - 1, d, hh, mm); const t = guess - zoneOffset(guess, tz); return guess - zoneOffset(t, tz); }

function occurrences(slot, from, days) {
  const out = new Set(); const [hh, mm] = slot.start_time.split(":").map(Number);
  for (let i = -1; i <= days; i++) {
    const p = zparts(from + i * 864e5, slot.timezone);
    if (WD[p.weekday] !== slot.weekday) continue;
    const t = zonedToUtc(+p.year, +p.month, +p.day, hh, mm, slot.timezone);
    if (t + slot.minutes * 60000 > from && t < from + days * 864e5) out.add(t);
  }
  return [...out].sort((a, b) => a - b);
}

  const u = new URL("https://calendar.google.com/calendar/render");
  u.searchParams.set("action", "TEMPLATE");

  u.searchParams.set("ctz", slot.timezone);

}

// Enter a 6-digit code: either the 1-hour code from "Email me a sign-in code", or the 24-hour code from a welcome email.
function codeView(email, sent) {
  app.innerHTML = `
  <div class="login panel">
    <h2>${sent ? "Check your email" : "Enter your code"}</h2>
    <p class="sub">${sent
      ? `We sent a 6-digit code to <b>${esc(email)}</b>. It works for 1 hour. You can also tap the sign-in link in that email.`
      : "Enter your email and the 6-digit code from your email."}</p>
    ${flash}
    <form id="codeform" class="form">
      <label${sent ? ' class="hidden"' : ""}>Email<input name="email" type="email" required autocomplete="email" value="${esc(email)}"></label>
      <label>6-digit code<input name="code" required inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456" style="font-size:22px;letter-spacing:6px;text-align:center"></label>
      <button class="primary" type="submit">Sign in</button>
    </form>
    <p class="note" style="margin:18px 0 0;text-align:center">Didn't get it? Check your junk folder, or <button type="button" class="textlink" id="resend">send a new code</button>.</p>

  flash = "";

  f.onsubmit = async (e) => {

    if (error) {
      // Not a 1-hour sign-in code: try it as a 24-hour welcome-email code.
      try {
        const r = await fetch(`${SUPABASE_URL}/functions/v1/redeem-invite`, { method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY }, body: JSON.stringify({ email: em, code }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.token_hash) throw new Error(j.error || "That code didn't work. Check it, or send a new code.");
        ({ error } = await sb.auth.verifyOtp({ token_hash: j.token_hash, type: "magiclink" }));

        btn.disabled = false; btn.textContent = "Sign in";
        flash = `<div class="msg bad">${esc(err.message)}</div>`;

  };

// ---------------- My Avelon (account holders and students with their own login) ----------------
// One view for everyone in a family. The account holder (whoever signed up) also gets

const learnerKey = (k) => `${k.parent_id}|${String(k.first_name || "").trim().toLowerCase()}`;
function groupLearners(list) {
  const m = new Map();
  for (const k of list) { const key = learnerKey(k); if (!m.has(key)) m.set(key, []); m.get(key).push(k); }
  return [...m.values()];
}
const andJoin = (xs) => xs.length <= 1 ? xs.join("") : xs.slice(0, -1).join(", ") + " & " + xs[xs.length - 1];
// One tutor: "Math & Science · with Maisha". Different tutors: "Math with Nile · Science with Maisha".
function subjectLine(rows, tname) {
  const subs = rows.map((r) => r.subject || "");
  const names = rows.map((r) => (r.tutor_id && tname(r.tutor_id)) || "");
  const uniq = [...new Set(names)];
  if (uniq.length === 1) return `${esc(andJoin(subs.filter(Boolean)))} <span class="with">· ${uniq[0] ? "with " + esc(uniq[0]) : "tutor coming soon"}</span>`;
  return rows.map((r, i) => `${esc(subs[i])} <span class="with">with ${names[i] ? esc(names[i]) : "tutor soon"}</span>`).join('<span class="dot">·</span>');
}

const segPick = {};
// The price list families see (per hour, CAD). The admin sets each student's actual rate in Students.

const priceList = () => `<div class="prices">${PRICES.map(([n, c]) => `<div class="price"><b>${money(c)}</b><span>per hour</span><em>${esc(n)}</em></div>`).join("")}</div>

async function myView(me, own, asStudent) {

    const group = isOwn(k) ? `<label class="check"><input type="checkbox" data-group="${k.id}" ${k.open_to_group ? "checked" : ""}> Open to a small group (2–3 students) if we can match one</label>` : "";
    const head = many ? `<div class="subhead"><h3>${esc(k.subject || "")}${TN[k.tutor_id] ? ` <span class="with">with ${esc(TN[k.tutor_id])}</span>` : ""}</h3>${pill(k.trial_status)}</div>` : "";
    return `<div class="${many ? "subblock" : ""}"${many ? ` data-segblock="${learnerKey(k)}" data-sub="${esc(k.subject || "")}"` : ""}>${head}${trial}${group}

    return `<div class="panel" id="m-s${i}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">${esc(k.first_name)} <span class="note" style="font-size:16px;font-weight:500">${esc(k.grade || "")}</span></h2>${many ? "" : pill(k.trial_status)}</div>

      ${many ? `<div class="seg" role="tablist">${rows.map((r) => `<button type="button" role="tab" data-seg="${esc(learnerKey(k))}" data-sub="${esc(r.subject || "")}">${esc(r.subject || "")}</button>`).join("")}</div>` : ""}
      ${rows.map((r) => subjectBlock(r, many)).join("")}</div>`;

  const payRows = (pays || []).map((p) => `<tr><td>${new Date(p.created_at).toLocaleDateString("en-CA")}</td><td>${money(p.amount_cents)} CAD</td><td>${pill(p.status)}${p.failure_message ? `<div class="note">${esc(p.failure_message)}</div>` : ""}</td></tr>`).join("");
  const first = holder ? (me.full_name || "there").split(" ")[0] : (kids[0]?.first_name || "there");
  hero("My Avelon", `Hi ${esc(first)}<span class="star">.</span>`, holder ? "Class times, notes, messages and payments in one place." : "Your class times, Google Meet links, notes and files.");

  const threads = kids.map((k) => ({ id: k.id, title: `${k.first_name}${k.subject ? " · " + k.subject : ""}`, sub: k.tutor_id && TN[k.tutor_id] ? `with ${TN[k.tutor_id]}` : "Tutor coming soon" }));
  const SECTIONS = [["m-overview", "Overview"], ["m-schedule", "Schedule"], ["m-messages", "Messages", unreadAll(M, me, threads)]]
    .concat(learners.map((g, i) => [`m-s${i}`, holder ? esc(g[0].first_name) : (learners.length > 1 ? esc(g[0].first_name) : "My classes")]))
    .concat([["m-classes", "Class log"]])
    .concat(holder ? [["m-payments", "Payments"], ["m-details", "Your details"], ["m-add", "Add a student"]] : []);
  const T = [["m-schedule", nextClass(sf.slots, byId), "next class", false, true], ["m-classes", mine.filter((c) => c.status !== "void").length, "classes logged"]];
  if (holder) T.push([kids.length ? "m-s0" : "m-add", learners.length, learners.length === 1 ? "student" : "students"], ["m-payments", me.card_last4 ? "•••• " + esc(me.card_last4) : "None", "card on file", !me.card_last4, true]);

  app.innerHTML = `
    ${flash}
    ${dash(SECTIONS, `
    <div class="panel" id="m-overview"><h2>Overview</h2>${tiles(T)}${holder ? `<h3 style="margin:26px 0 12px">Prices</h3>${priceList()}` : ""}${holder && !kids.length ? `<p class="note" style="margin-top:18px">Add a student to get started.</p><button class="primary" type="button" data-tab="m-add">Add a student</button>` : ""}</div>
    <div class="panel" id="m-schedule"><h2>Upcoming classes</h2>${upcomingHtml(sf.slots, byId, { days: 14, empty: "No classes scheduled yet. Once a tutor is matched, class times and Google Meet links appear here." })}</div>
    <div class="panel" id="m-messages"><h2>Messages</h2><p class="note">Message ${kids.length ? "your tutor" : "us"} about classes: rescheduling, questions about homework, or anything else.</p><div id="msgbox"></div></div>
    ${learners.map(studentPanel).join("")}
    <div class="panel" id="m-classes"><h2>Class log</h2><p class="note">${holder ? "Each class your tutor logs shows here. There's nothing to confirm: classes are charged at the booked length and billed after 48 hours. If something isn't right, press Report a problem within 48 hours and we won't charge that class until it's sorted." : "Every class your tutor has logged, with notes and homework."}</p>${classTable(mine, kids.length > 1)}</div>
    ${holder ? `

    <div class="panel" id="m-details"><h2>Your details</h2>
        <form id="me" class="form"><div class="row"><label>Name<input name="full_name" value="${esc(me.full_name)}"></label><label>Phone<input name="phone" value="${esc(me.phone)}"></label></div>
        <p class="note" style="margin:0">Email: ${esc(me.email)}</p><button class="small" type="submit">Save</button></form></div>
    <div class="panel" id="m-add"><h2>Add a student</h2>
      <form id="addkid" class="form">
        <div class="row"><label>First name<input name="first_name" required></label>

        <label>Subject<select name="subject"><option>Math</option><option>Science</option><option>English</option><option>Bangla</option></select></label></div>
        <label>Student's email <span class="note" style="font-weight:400">(optional: lets them sign in to My Avelon to see classes, notes and files)</span><input name="student_email" type="email"></label>
        <button class="primary" type="submit">Add student</button></form></div>` : ""}`)}`;
  flash = "";

  if (holder) {
    document.getElementById("addcard").onclick = async (e) => {
      const ag = document.getElementById("agree");
      if (ag && !ag.checked) { show("Please tick the box to agree to the Terms before adding a card.", "bad"); return; }
      e.target.disabled = true;
      try { const { url } = await call("create-card-session", { agree: !!(ag && ag.checked) }); location.href = url; }
      catch (err) { show(err.message, "bad"); }
    };
    document.getElementById("me").onsubmit = async (e) => {
      e.preventDefault(); const f = new FormData(e.target);
      const { error } = await sb.from("profiles").update({ full_name: f.get("full_name"), phone: f.get("phone") }).eq("id", me.id);
      show(error ? error.message : "Saved.", error ? "bad" : "ok");
    };
    document.getElementById("addkid").onsubmit = async (e) => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      if (!f.student_email) delete f.student_email;
      const { error } = await sb.from("students").insert({ ...f, parent_id: me.id });
      show(error ? error.message : `${f.first_name} added. We'll be in touch to match a tutor.`, error ? "bad" : "ok");
    };
  }
  app.querySelectorAll("[data-trial]").forEach((b) => b.onclick = async () => {
    const d = b.dataset.trial;
    if (d === "ended" && !confirm("Stop after the trial? The trial classes stay free.")) return;
    try { await rpc("parent_trial_decision", { p_student: b.dataset.id, p_decision: d });
      show(d === "continuing" ? "Wonderful, you're enrolled!" : "Okay, classes will stop. The trial classes are free."); }
    catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-flag]").forEach((b) => b.onclick = async () => {
    const r = prompt("What wasn't right? (for example: the class didn't happen, or it was shorter)");
    if (!r || !r.trim()) return;
    try { await rpc("review_session", { p_session: b.dataset.flag, p_action: "flag", p_reason: r }); show("Thanks for letting us know. We'll look into it and won't charge this class until it's sorted."); }
    catch (err) { show(err.message, "bad"); }
  });
  // Subject switcher inside a student's tab (only when they take more than one subject).
  const pickSeg = (key, sub) => {

    app.querySelectorAll("[data-seg]").forEach((b) => { if (b.dataset.seg === key) b.classList.toggle("on", b.dataset.sub === sub); });
  };
  for (const g of learners) if (g.length > 1) { const key = learnerKey(g[0]); pickSeg(key, g.some((r) => r.subject === segPick[key]) ? segPick[key] : g[0].subject || ""); }
  app.querySelectorAll("[data-seg]").forEach((b) => b.onclick = () => pickSeg(b.dataset.seg, b.dataset.sub));
  bindShared(me);
  bindDash("family", "m-overview");
  mountMessages("msgbox", threads, me, M, { empty: "Messages open once your student is set up.", onRead: () => msgCount("m-messages", unreadAll(M, me, threads)) });
  if (justSaved && !me.card_last4) { justSaved = false; setTimeout(route, 4000); }
}

// ---------------- Messages ----------------
// One conversation per student per subject. The parent, the student (own login), the tutor and Avelon all see it.
const ROLE_LABEL = { parent: "Parent", student: "Student", tutor: "Tutor", admin: "Avelon" };
const msgPick = {};
let msgTimer = null;
async function loadMsgs(me) {
  const [{ data: msgs }, { data: reads }] = await Promise.all([
    sb.from("messages").select("*").order("created_at").limit(1000),
    sb.from("message_reads").select("student_id, last_read_at").eq("user_id", me.id),
  ]);
  return { msgs: msgs || [], reads: Object.fromEntries((reads || []).map((r) => [r.student_id, r.last_read_at])) };
}
const unreadIn = (M, me, sid) => M.msgs.filter((m) => m.student_id === sid && m.sender_id !== me.id && (!M.reads[sid] || m.created_at > M.reads[sid])).length;
const unreadAll = (M, me, threads) => threads.reduce((a, t) => a + unreadIn(M, me, t.id), 0);
const msgTime = (iso) => new Date(iso).toLocaleString("en-CA", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

// threads: [{ id, title, sub }]. Renders into the element with id boxId and keeps it fresh while open.
function msgCount(tab, n) {
  const b = app.querySelector(`.side [data-tab="${tab}"]`); if (!b) return;
  b.querySelector(".cnt")?.remove(); if (n) b.insertAdjacentHTML("beforeend", `<span class="cnt">${n}</span>`);
}
function mountMessages(boxId, threads, me, M, opts = {}) {
  const box = document.getElementById(boxId); if (!box) return;
  const admin = me.role === "admin";
  const last = (id) => { const l = M.msgs.filter((m) => m.student_id === id); return l[l.length - 1]; };
  const sorted = threads.slice().sort((a, b) => {
    const fa = admin && M.msgs.some((m) => m.student_id === a.id && m.flagged), fb = admin && M.msgs.some((m) => m.student_id === b.id && m.flagged);
    if (fa !== fb) return fa ? -1 : 1;
    return (last(b.id)?.created_at || "").localeCompare(last(a.id)?.created_at || "");
  });
  const markRead = async (id) => {
    const now = new Date().toISOString(); M.reads[id] = now;
    await sb.from("message_reads").upsert({ user_id: me.id, student_id: id, last_read_at: now });
    if (opts.onRead) opts.onRead();
  };
  const render = () => {
    if (!sorted.length) { box.innerHTML = `<p class="note">${opts.empty || "No conversations yet."}</p>`; return; }
    const has = (id) => M.msgs.some((m) => m.student_id === id);
    const cur = sorted.find((t) => t.id === msgPick[boxId]) || sorted.find((t) => has(t.id)) || sorted[0];
    msgPick[boxId] = cur.id;
    // Admin: only conversations with messages are listed; any other student can be picked from "New conversation".
    const shown = admin ? sorted.filter((t) => has(t.id) || t.id === cur.id) : sorted;
    const others = admin ? sorted.filter((t) => !shown.includes(t)) : [];
    const tools = (shown.length > 6 ? `<input class="msearch" type="search" placeholder="Search students" aria-label="Search conversations">` : "")
      + (others.length ? `<select class="mnew" aria-label="Start a new conversation"><option value="">+ New conversation…</option>${others.map((t) => `<option value="${t.id}">${esc(t.title)}</option>`).join("")}</select>` : "");
    const list = shown.length > 1 || tools ? `<div class="mside">${tools}<div class="mlist">${shown.map((t) => {
      const l = last(t.id), n = t.id === cur.id ? 0 : unreadIn(M, me, t.id), fl = admin && M.msgs.some((m) => m.student_id === t.id && m.flagged);
      return `<button type="button" class="mthread${t.id === cur.id ? " on" : ""}" data-thread="${t.id}"><span class="mt">${esc(t.title)}${n ? `<span class="cnt">${n}</span>` : ""}${fl ? ' <span class="pill warn">Flagged</span>' : ""}</span><span class="ms">${l ? esc(l.sender_name + ": " + l.body.slice(0, 60)) : esc(t.sub || "No messages yet")}</span></button>`;
    }).join("")}</div></div>` : "";
    const ms = M.msgs.filter((m) => m.student_id === cur.id);
    const bubbles = ms.map((m) => {
      const mine = m.sender_id === me.id;
      return `<div class="mb${mine ? " me" : ""}${m.flagged && admin ? " fl" : ""}"><div class="mh">${esc(m.sender_name)} <span>${ROLE_LABEL[m.sender_role] || ""} · ${esc(msgTime(m.created_at))}</span></div><div class="mx">${esc(m.body).replace(/\n/g, "<br>")}</div>${admin && m.flagged ? `<div class="mfl">Flagged: may share contact details or an outside link. <button class="lk" type="button" data-mok="${m.id}">Mark OK</button><button class="lk red" type="button" data-mdel="${m.id}">Delete</button></div>` : admin ? `<div class="mfl quiet"><button class="lk red" type="button" data-mdel="${m.id}">Delete</button></div>` : ""}</div>`;
    }).join("");
    box.innerHTML = `<div class="mwrap${list ? "" : " one"}">${list}<div class="mconv">
      <div class="mhead"><b>${esc(cur.title)}</b>${cur.sub ? ` <span class="note">${esc(cur.sub)}</span>` : ""}</div>
      <div class="mscroll">${bubbles || `<p class="note" style="text-align:center;margin:30px 0">No messages yet. Say hello, or ask about a class.</p>`}</div>
      <form class="msend"><textarea name="body" rows="2" maxlength="2000" placeholder="Write a message…" required></textarea><button class="primary small" type="submit">Send</button></form>
      <p class="note mnote">${opts.note || "The parent, student, tutor and Avelon can all read this conversation. Please keep messages about classes and don't share phone numbers or emails."}</p></div></div>`;
    const sc = box.querySelector(".mscroll"); sc.scrollTop = sc.scrollHeight;
    box.querySelectorAll("[data-thread]").forEach((b) => b.onclick = () => { msgPick[boxId] = b.dataset.thread; render(); markRead(b.dataset.thread); });
    const srch = box.querySelector(".msearch");
    if (srch) srch.oninput = () => { const q = srch.value.trim().toLowerCase(); box.querySelectorAll("[data-thread]").forEach((b) => b.classList.toggle("hidden", !!q && !b.textContent.toLowerCase().includes(q))); };
    const mnew = box.querySelector(".mnew");
    if (mnew) mnew.onchange = () => { if (mnew.value) { msgPick[boxId] = mnew.value; render(); box.querySelector(".msend textarea").focus(); } };
    const f = box.querySelector(".msend"), ta = f.body;
    ta.onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) f.requestSubmit(); };
    f.onsubmit = async (e) => {
      e.preventDefault(); const text = ta.value.trim(); if (!text) return;
      const btn = f.querySelector("button"); btn.disabled = true;
      try { const r = await call("send-message", { student_id: cur.id, body: text }); if (r?.message) M.msgs.push(r.message); M.reads[cur.id] = new Date().toISOString(); render(); }
      catch (err) { btn.disabled = false; alert(err.message); }
    };
    box.querySelectorAll("[data-mok]").forEach((b) => b.onclick = async () => {
      const { error } = await sb.from("messages").update({ flagged: false }).eq("id", b.dataset.mok);
      if (error) return alert(error.message); M.msgs.find((m) => m.id === b.dataset.mok).flagged = false; render(); if (opts.onRead) opts.onRead();
    });
    box.querySelectorAll("[data-mdel]").forEach((b) => b.onclick = async () => {
      if (!confirm("Delete this message for everyone?")) return;
      const { error } = await sb.from("messages").delete().eq("id", b.dataset.mdel);
      if (error) return alert(error.message); M.msgs = M.msgs.filter((m) => m.id !== b.dataset.mdel); render();
    });
  };
  render();
  // Opening the Messages tab marks the shown conversation as read; refresh every 20 seconds while it's open.
  const panel = box.closest(".panel");
  const visible = () => panel && panel.classList.contains("on") && document.body.contains(box);
  app.querySelectorAll(`[data-tab="${panel?.id}"]`).forEach((b) => b.addEventListener("click", () => { if (msgPick[boxId]) markRead(msgPick[boxId]); }));
  if (visible() && msgPick[boxId]) markRead(msgPick[boxId]);
  clearInterval(msgTimer);
  msgTimer = setInterval(async () => {
    if (!document.body.contains(box)) return clearInterval(msgTimer);
    if (!visible() || box.querySelector("textarea")?.value) return;
    const fresh = await loadMsgs(me);
    if (fresh.msgs.length !== M.msgs.length || fresh.msgs.some((m, i) => m.id !== M.msgs[i]?.id || m.flagged !== M.msgs[i]?.flagged)) { M.msgs = fresh.msgs; render(); if (msgPick[boxId]) markRead(msgPick[boxId]); }
  }, 20000);
}

  const tutorRows = tutors.concat(admins.filter((a) => (kids || []).some((k) => k.tutor_id === a.id))).map((t) => {

  const billable = (unbilled || []).filter((c) => K[c.student_id] && (!(c.trial_number === 2 || c.trial_number === 3) || K[c.student_id].trial_status === "continuing"));
  const byFam = {};
  billable.forEach((c) => { const pid = K[c.student_id].parent_id; (byFam[pid] ||= { n: 0, total: 0, kids: new Set() }); byFam[pid].n++; byFam[pid].total += c.amount_cents; byFam[pid].kids.add(K[c.student_id].first_name); });
  const readyRows = Object.entries(byFam).map(([pid, f]) => `<tr><td><input type="checkbox" data-billfam="${pid}" data-amt="${f.total}" ${P[pid]?.card_last4 ? "checked" : ""}></td><td>${who(P[pid])}<div class="note">${esc([...f.kids].join(", "))}</div></td><td>${f.n}</td><td><b>${money(f.total)}</b></td><td>${P[pid]?.card_last4 ? "•••• " + esc(P[pid].card_last4) : '<span class="pill warn">No card</span>'}</td></tr>`).join("");
  const waitingConfirm = (classes || []).filter((c) => c.status === "pending" && c.amount_cents > 0).length;
  const aThreads = (kids || []).filter((k) => k.active).map((k) => ({ id: k.id, title: `${k.first_name}${k.subject ? " · " + k.subject : ""}`, sub: `Parent: ${P[k.parent_id]?.full_name || P[k.parent_id]?.email || "?"} · Tutor: ${P[k.tutor_id]?.full_name || "none"}` }));
  const SECTIONS = [["overview", "Overview"], ["requests", "Trial requests", newReqs], ["people", "Add people"], ["week", "This week", weekCount], ["attention", "Needs attention", open.length], ["messages", "Messages", M.msgs.filter((m) => m.flagged).length + unreadAll(M, me, aThreads)], ["students", "Students"], ["parents", "Parents"], ["tutors", "Tutors"], ["schedules", "Schedules & files"], ["reports", "Weekend reports"], ["billing", "Billing"], ["storage", "Storage"]];
  const TILES = [["requests", newReqs, "new trial requests", newReqs > 0], ["week", weekCount, "classes this week"], ["attention", open.length, "classes need attention", (open || []).some((c) => c.status === "flagged")], ["students", activeKids, "active students"], ["tutors", tutors.length, "tutors"], ["parents", parents.length, "parents"], ["storage", storagePct + "%", "storage used", storagePct >= 75]];
  hero("Admin", 'Avelon <span class="star">HQ.</span>', "Trial requests, schedules, tutors, families and billing in one place.");
  app.innerHTML = `
    ${flash}
    <div class="dash">
    <aside class="side" aria-label="Admin sections">${SECTIONS.map(([id, t, n]) => `<button type="button" class="tab" data-tab="${id}">${t}${n ? `<span class="cnt">${n}</span>` : ""}</button>`).join("")}</aside>
    <div class="dmain">
    <div class="panel" id="overview"><h2>Overview</h2><div class="tiles">${TILES.map(([id, num, label, warn]) => `<button type="button" class="tile${warn ? " warn" : ""}" data-tab="${id}"><b>${num}</b><span>${label}</span></button>`).join("")}</div></div>
    <div class="panel" id="requests"><h2>Trial requests${newReqs ? ` <span class="pill blue">${newReqs} new</span>` : ""}</h2><p class="note">From the "Start with 3 trial classes" form on the homepage. Each family already got the welcome email. After your call, press <b>Set up family</b> to create their account and student. Booked or closed requests can be removed.</p><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Parent/student</th><th>Grade</th><th>Status</th><th></th></tr></thead><tbody>${reqRows || `<tr><td colspan="5" class="note">No requests yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="week"><h2>This week</h2>${upcomingHtml(sf.slots, K, { days: 7, empty: "No classes scheduled this week.", extra: (k) => "Tutor: " + (who(P[k.tutor_id]) || "none") })}</div>
    <div class="panel" id="messages"><h2>Messages</h2><p class="note">Every conversation between tutors and families. Messages that look like they share a phone number, email, another app or an outside link (YouTube, Khan Academy and Meet links are fine) are flagged (amber) and emailed to you. Messages you send show as "Avelon Academy".</p><div id="amsgbox"></div></div>
    <div class="panel" id="attention"><h2>Problems reported (${open.length})</h2><p class="note">A family reported a problem with these classes within 48 hours. Sort it out with them, then bill the class or choose not to charge it.</p><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Student</th><th>Tutor</th><th>Class</th><th>Status</th></tr></thead><tbody>${openRows || `<tr><td colspan="5" class="note">Nothing to review.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="students"><h2>Students (${kidGroups.length})</h2><p class="note">Press ✎ next to a name to edit the student, change tutor or rate, add a subject or remove them. Tutors can only log classes once both are set. Prices: one-on-one $25/hour; small group and Bangla $20/hour. Only you see these rates; families see the price list.</p>
      ${matchable.length ? `<div class="msg info">Possible small groups: ${matchable.map(([g, n]) => `<b>${esc(g)}</b> (${n.map(esc).join(", ")})`).join("; ")}</div>` : ""}
      <div class="scroll"><table class="table"><thead><tr><th>Student</th><th>Tutor</th><th>$/hour</th><th>Status</th></tr></thead><tbody>${kidRows || `<tr><td colspan="6" class="note">No students yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="schedules"><h2>Schedules &amp; files</h2><p class="note">Set each student's weekly class time and Google Meet link. The family, the student and the tutor all see it.</p>
      ${(kids || []).filter((k) => k.active).map((k) => `<details class="kidbox"><summary><b>${esc(k.first_name)}</b> <span class="note">${esc([k.grade, k.subject].filter(Boolean).join(" · "))} · Tutor: ${who(P[k.tutor_id]) || "none"} · ${sf.slots.filter((s) => s.student_id === k.id).length} weekly class(es)</span></summary>${slotsHtml(k, sf.slots, true)}${filesHtml(k, sf.files, me)}</details>`).join("") || `<p class="note">No students yet.</p>`}</div>
    <div class="panel" id="people"><h2>Add people</h2>
      <p class="note">Creates their account and emails them that My Avelon is ready. They sign in with their email; no password. If the email already has an account, it's updated instead.</p>
      <h3 style="margin:22px 0 10px">Add a family</h3>
      <form id="addfam" class="form"><input type="hidden" name="request_id">
        <div class="row"><label>Student's first name<input name="student_first_name" required></label>
          <label>Grade<select name="grade">${Array.from({ length: 10 }, (_, i) => `<option>Grade ${i + 1}</option>`).join("")}</select></label>
          <label>Subject<select name="subject">${SUBJECTS.map((x) => `<option>${x}</option>`).join("")}</select></label></div>
        <div class="row"><label>Student's email <span class="note" style="font-weight:400">(optional, Grade 6+)</span><input name="student_email" type="email"></label>
          <label>Tutor <span class="note" style="font-weight:400">(optional)</span><select name="tutor_id"><option value="">Not yet</option>${tutors.map((t) => `<option value="${t.id}">${tutorLabel(t)}</option>`).join("")}</select></label>
          <label>Rate, $/hour <span class="note" style="font-weight:400">(optional)</span><input name="rate" type="number" min="0" step="0.5"></label></div>
        <div class="row"><label>Parent's name<input name="full_name" required></label><label>Parent's email <span class="note" style="font-weight:400">(signs in, pays)</span><input name="email" type="email" required></label><label>Parent's phone<input name="phone" type="tel"></label></div>
        <label class="check"><input type="checkbox" name="send_email" checked> Email them that their account is ready</label>
        <button class="primary" type="submit">Add family</button></form>
      <h3 style="margin:34px 0 10px">Add a tutor</h3>
      <form id="addtutor" class="form">
        <div class="row"><label>Tutor's name<input name="full_name" required></label><label>Email<input name="email" type="email" required></label><label>Phone <span class="note" style="font-weight:400">(optional)</span><input name="phone" type="tel"></label></div>
        <label class="check"><input type="checkbox" name="send_email" checked> Email them a welcome with how to sign in</label>
        <button class="primary" type="submit">Add tutor</button></form></div>
    <div class="panel" id="tutors"><h2>Tutors (${tutors.length})</h2><p class="note">Add new tutors in <b>Add people</b>. Press ✎ to edit a tutor's name, phone or pay, or to remove their access. <b>Pay is only visible to you.</b> This month = classes logged since the 1st × their pay.</p><div class="scroll"><table class="table"><thead><tr><th>Tutor</th><th>Students</th><th>Pay</th><th>This month</th><th></th></tr></thead><tbody>${tutorRows || `<tr><td colspan="5" class="note">No tutors yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="parents"><h2>Parents (${parents.length})</h2><p class="note">Families you add, plus anyone who signs in on their own. Press ✎ to edit a parent's name or phone, or to remove the family.</p><div class="scroll"><table class="table"><thead><tr><th>Parent</th><th>Children</th><th>Card</th><th></th></tr></thead><tbody>${parentRows || `<tr><td colspan="4" class="note">No parents yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="reports"><h2>Weekend reports</h2><p class="note">Every Saturday morning, each student with classes that week gets one email to the email on file (the student's own email if added, otherwise the parent's): what was covered, from the tutor's class notes, and what to practise. Students with no classes that week get nothing.</p>
      <button id="previewreports" type="button">Email me a preview of this week's reports</button>
      <h3 style="margin-top:22px">Recently sent</h3><div class="scroll"><table class="table"><thead><tr><th>Week of</th><th>Student</th><th>Sent to</th><th>Classes</th></tr></thead><tbody>${(reports || []).map((r) => `<tr><td>${esc(r.week_start)}</td><td>${esc(K[r.student_id]?.first_name || "")}</td><td>${esc(r.sent_to)}</td><td>${r.class_count}</td></tr>`).join("") || `<tr><td colspan="4" class="note">None sent yet. The first ones go out on Saturday.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="billing"><h2>Billing</h2><p class="note">Every Monday, each family is charged automatically for classes logged more than 48 hours ago (with no problem reported) that haven't been charged yet. Only families listed below have anything to charge. To charge some now (for example after a family fixes a failed card), tick them and press Charge selected.</p>
      ${readyRows ? `<div class="scroll"><table class="table"><thead><tr><th style="width:36px"><input type="checkbox" id="billall" checked aria-label="Select all"></th><th>Family</th><th>Classes</th><th>Amount</th><th>Card</th></tr></thead><tbody>${readyRows}</tbody></table></div>
      <button id="bill" class="primary" type="button" style="margin-top:14px">Charge selected</button>` : `<p class="note"><b>Nothing to charge right now.</b></p>`}
      ${waitingConfirm ? `<p class="note">${waitingConfirm} more ${waitingConfirm === 1 ? "class is" : "classes are"} inside the 48-hour window for the family to report a problem. They're added automatically once it passes.</p>` : ""}
      <h3 style="margin-top:26px">Payments</h3><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Parent</th><th>Amount</th><th>Status</th></tr></thead><tbody>${payRows || `<tr><td colspan="4" class="note">No payments yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="storage"><h2>Storage</h2>${usageHtml}<p class="note">Free plan limits. Class files are deleted automatically 3 months after upload. If either bar passes 75%, you'll get an email on Monday.</p></div>
    </div></div>`;
  flash = "";

  const pick = (id) => {
    adminTab = id;
    app.querySelectorAll(".dmain > .panel").forEach((p) => p.classList.toggle("on", p.id === id));
    app.querySelectorAll(".side .tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === id));
  };
  app.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { pick(b.dataset.tab); if (innerWidth < 900) app.querySelector(".dmain").scrollIntoView({ behavior: "smooth" }); });
  pick(app.querySelector(`#${adminTab}`) ? adminTab : "overview");
  mountMessages("amsgbox", aThreads, me, M, { empty: "No active students yet.", note: "You're posting as Avelon Academy. Everyone in this conversation sees it.", onRead: () => msgCount("messages", M.msgs.filter((m) => m.flagged).length + unreadAll(M, me, aThreads)) });
  document.getElementById("previewreports").onclick = async (e) => {
    e.target.disabled = true;
    try { const r = await call("weekend-report", { preview: true }); show(r.note || (r.sent.length ? `Sent ${r.sent.length} preview(s) to your inbox. Nothing was sent to families.` : "No reports to preview.")); }
    catch (err) { show(err.message, "bad"); }
  };
  const billBtn = document.getElementById("bill");
  const billAll = document.getElementById("billall");
  if (billAll) billAll.onchange = () => app.querySelectorAll("[data-billfam]").forEach((x) => { x.checked = billAll.checked; });
  if (billBtn) billBtn.onclick = async (e) => {
    const picked = [...app.querySelectorAll("[data-billfam]:checked")];
    if (!picked.length) return show("Tick at least one family to charge.", "bad");
    const total = picked.reduce((a, x) => a + Number(x.dataset.amt), 0);
    if (!confirm(`Charge ${picked.length} ${picked.length === 1 ? "family" : "families"} a total of ${money(total)} now?`)) return;
    e.target.disabled = true;
    try { const r = await call("weekly-billing", { parent_ids: picked.map((x) => x.dataset.billfam) }); show(`Charged ${r.charged.length}, failed ${r.failed.length}, no card ${r.noCard.length}.`); }
    catch (err) { e.target.disabled = false; show(err.message, "bad"); }
  };
  app.querySelectorAll("[data-set]").forEach((b) => b.onclick = async () => {
    try { await rpc("admin_set_session", { p_session: b.dataset.id, p_status: b.dataset.set }); show("Updated."); }
    catch (err) { show(err.message, "bad"); }
  });
  // Students: pencil opens edit mode for one student (all their subjects); Save writes every row.
  app.querySelectorAll("[data-editkid]").forEach((b) => b.onclick = () => { editKid = b.dataset.editkid; route(); });
  app.querySelectorAll("[data-editcancel]").forEach((b) => b.onclick = () => { editKid = null; route(); });
  app.querySelectorAll("[data-editsave]").forEach((b) => b.onclick = async () => {
    const trs = [...app.querySelectorAll("tr.editing[data-kid]")], top = trs[0], g = (tr, n) => tr.querySelector(`[name=${n}]`);
    const first = g(top, "first_name").value.trim(), grade = g(top, "grade").value, email = g(top, "student_email").value.trim();
    const subs = trs.map((tr) => g(tr, "subject").value);
    if (!first) return show("Please enter the student's first name.", "bad");
    if (new Set(subs).size !== subs.length) return show("Each subject can only be listed once for a student.", "bad");
    b.disabled = true;
    try {
      for (const tr of trs) {
        const rate = g(tr, "rate").value === "" ? null : Math.round(Number(g(tr, "rate").value) * 100);
        await rpc("admin_edit_student", { p_student: tr.dataset.kid, p_first_name: first, p_grade: grade, p_subject: g(tr, "subject").value, p_student_email: email || null,
          p_tutor: g(tr, "tutor").value || null, p_rate_cents: rate, p_trial_status: g(tr, "trial").value, p_active: g(tr, "active").checked });
      }
      editKid = null; show(`${first} saved.`);
    } catch (err) { b.disabled = false; show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-addsub]").forEach((b) => b.onclick = () => {
    const row = app.querySelector(`[data-addrow="${b.dataset.addsub}"]`); row.classList.remove("hidden"); row.querySelector("select").focus();
  });
  app.querySelectorAll("[data-addcancel]").forEach((b) => b.onclick = () => app.querySelector(`[data-addrow="${b.dataset.addcancel}"]`).classList.add("hidden"));
  app.querySelectorAll("[data-addsubf]").forEach((f) => f.onsubmit = async (e) => {
    e.preventDefault(); const d = f.dataset, v = Object.fromEntries(new FormData(f)), btn = f.querySelector("[type=submit]");
    if (!d.parent) return show("This student's parent has no email on file.", "bad");
    btn.disabled = true;
    try {
      await call("add-person", { kind: "family", email: d.parent, full_name: d.pname || d.parent.split("@")[0], student_first_name: d.first, grade: d.grade, subject: v.subject, student_email: d.semail, tutor_id: v.tutor_id, rate: v.rate, send_email: false });
      show(`${v.subject} added for ${d.first}. Set the weekly time in Schedules & files.`);
    } catch (err) { btn.disabled = false; show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-req]").forEach((sel) => sel.onchange = async () => {
    const { error } = await sb.from("trial_requests").update({ status: sel.value }).eq("id", sel.dataset.req);
    show(error ? error.message : "Request updated.", error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-delreq]").forEach((b) => b.onclick = async () => {
    if (!confirm("Remove this trial request? This can't be undone.")) return;
    const { error } = await sb.from("trial_requests").delete().eq("id", b.dataset.delreq);
    show(error ? error.message : "Request removed.", error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-setup]").forEach((b) => b.onclick = () => {
    const r = (reqs || []).find((x) => x.id === b.dataset.setup); const f = document.getElementById("addfam");
    f.request_id.value = r.id; f.full_name.value = r.parent_name || ""; f.email.value = r.email || ""; f.phone.value = r.phone || "";
    f.student_first_name.value = ""; if (r.grade) f.grade.value = r.grade; if (SUBJECTS.includes(r.subject)) f.subject.value = r.subject;
    app.querySelector('.side [data-tab="people"]').click(); f.student_first_name.focus();
  });
  const addPerson = (id, kind) => { const f = document.getElementById(id); f.onsubmit = async (e) => {
    e.preventDefault(); const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
    const d = Object.fromEntries(new FormData(f)); d.kind = kind; d.send_email = !!f.send_email.checked;
    try { await call("add-person", d); show(kind === "tutor" ? `${d.full_name} is now a tutor.${d.send_email ? " Welcome email sent." : ""}` : `${d.student_first_name} added under ${d.full_name}.${d.send_email ? " They've been emailed." : ""}`); }
    catch (err) { btn.disabled = false; show(err.message, "bad"); }
  }; };
  addPerson("addfam", "family"); addPerson("addtutor", "tutor");
  const removeMsg = (r) => r.result === "deleted" ? `${r.name} was deleted.` : r.result === "archived" ? `${r.name} was removed. Their class and payment records are kept.` : `${r.name} was restored. Turn their students back on in Students.`;
  app.querySelectorAll("[data-resend]").forEach((b) => b.onclick = async () => {
    if (!confirm(`Email a new 24-hour sign-in code to ${b.dataset.resend}?`)) return;
    b.disabled = true;
    try { await call("add-person", { kind: "resend", email: b.dataset.resend }); show(`Sign-in code sent to ${b.dataset.resend}.`); }
    catch (err) { b.disabled = false; show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-rmkid]").forEach((b) => b.onclick = async () => {
    if (!confirm(`Remove ${b.dataset.name}?\n\nTheir weekly class times are cleared and their tutor can no longer log classes. If they never had a class, they are deleted completely; otherwise their class and payment records are kept.`)) return;
    try { show(removeMsg(await call("remove-person", { kind: "student", id: b.dataset.rmkid }))); } catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-rmfam]").forEach((b) => b.onclick = async () => {
    if (!confirm(`Remove the ${b.dataset.name} family?\n\nThey can no longer log in and all their students are removed. If they never had a class or payment, the account is deleted completely; otherwise their records are kept and you can restore them later. Any confirmed classes not yet charged will still be charged.`)) return;
    try { show(removeMsg(await call("remove-person", { kind: "parent", id: b.dataset.rmfam }))); } catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-restorefam]").forEach((b) => b.onclick = async () => {
    if (!confirm(`Restore ${b.dataset.name}? They'll be able to log in again.`)) return;
    try { show(removeMsg(await call("remove-person", { kind: "parent", id: b.dataset.restorefam, action: "restore" }))); } catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-untutor]").forEach((b) => b.onclick = async () => {
    if (!confirm(`Remove ${b.dataset.name}'s tutor access? They'll no longer see any students. Reassign their students first.`)) return;
    try { await rpc("admin_set_role", { p_user: b.dataset.untutor, p_role: "parent" }); show("Tutor access removed."); }
    catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-editperson]").forEach((b) => b.onclick = () => { editPerson = b.dataset.editperson; route(); });
  app.querySelectorAll("[data-personcancel]").forEach((b) => b.onclick = () => { editPerson = null; route(); });
  app.querySelectorAll("[data-personsave]").forEach((b) => b.onclick = async () => {
    const tr = b.closest("tr"), g = (n) => tr.querySelector(`[name=${n}]`), id = b.dataset.personsave;
    b.disabled = true;
    try {
      await rpc("admin_set_profile", { p_user: id, p_name: g("full_name").value.trim(), p_phone: g("phone").value.trim() });
      if (g("pay")) {
        const v = g("pay").value.trim(), cents = v === "" ? null : Math.round(Number(v) * 100);
        if (cents != null && !(cents >= 0 && cents <= 100000)) throw new Error("Pay should be between $0 and $1,000 per hour.");
        const { error } = await sb.from("tutor_pay").upsert({ tutor_id: id, rate_cents: cents, updated_at: new Date().toISOString() });
        if (error) throw new Error(error.message);
      }
      editPerson = null; show("Saved.");
    } catch (err) { b.disabled = false; show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-rename]").forEach((b) => b.onclick = async () => {
    const n = prompt("New name:", b.dataset.name || ""); if (n == null || !n.trim()) return;
    try { await rpc("admin_set_name", { p_user: b.dataset.rename, p_name: n.trim() }); show("Name updated."); }
    catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-role]").forEach((s) => s.onchange = async () => {
    if (s.value === "admin" && !confirm("Give this person full admin access, including all families and payments?")) { route(); return; }
    try { await rpc("admin_set_role", { p_user: s.dataset.role, p_role: s.value }); show("Role updated."); }
    catch (err) { show(err.message, "bad"); }
  });
  bindShared(me);
}

// ---------------- Router ----------------
async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: me, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !me) {
    // The saved sign-in points to an account that no longer exists (or can't be read): sign out and start fresh.
    await sb.auth.signOut();
    flash = `<div class="msg info">Your sign-in expired. Please sign in again with your email.</div>`;
    return loginView();
  }
  document.getElementById("who").textContent = me.email;
  const so = document.getElementById("signout"); so.classList.remove("hidden");
  so.onclick = async () => { await sb.auth.signOut(); loginView(); };
  try {
    if (me.role === "admin") await adminView(me);
    else if (me.role === "tutor") await tutorView(me);
    else {
      const { data: linked } = await sb.from("students").select("*");
      const own = (linked || []).filter((k) => k.parent_id === me.id), asStudent = (linked || []).filter((k) => k.parent_id !== me.id);
      await myView(me, own, asStudent);
    }
  } catch (err) { app.innerHTML = `<div class="msg bad">${esc(err.message)}</div>`; }
}
sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT") route(); });
route();
</script>
