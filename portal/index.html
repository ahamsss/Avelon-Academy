main{flex:1;width:100%;max-width:1180px;margin:-72px auto 0;padding:0 28px 90px;position:relative;z-index:2}
h2{font-weight:700;font-size:24px;margin:0 0 14px}
.sub{color:var(--muted);margin:0 0 26px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;margin-bottom:22px;box-shadow:0 1px 2px rgba(11,13,18,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.grid{margin-bottom:22px}.grid .panel{margin-bottom:0}.panel .grid{margin-bottom:0}
.form button{justify-self:start}.login .form button{justify-self:stretch}
label .note{display:inline;font-weight:400}
.kid{background:var(--soft)!important;border-color:transparent!important}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-weight:400;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-light);outline-offset:1px}
.form{display:grid;gap:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;padding:10px 20px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);min-height:46px;transition:background .25s,color .25s,border-color .25s}
button:hover{background:var(--navy);color:#fff}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
button.primary:hover{background:var(--navy-2);border-color:var(--navy-2)}
button.small{min-height:36px;padding:5px 14px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line)}
.table td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--soft);color:var(--ink)}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none}
.login{max-width:480px;margin:0 auto}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
footer{background:var(--navy);color:#A3ACBF;font-size:14px}
footer .in{max-width:1180px;margin:0 auto;padding:28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

body.dashmode .sky .in{padding-bottom:56px}
body.dashmode main{margin-top:28px}
.dash{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:2px}
.side .tab{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer}
.side .tab:hover{background:var(--soft)}
.side .tab.on{background:var(--navy);color:#fff}
.side .tab:focus-visible{outline:2px solid var(--blue-light)}
.cnt{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#E9EEF8;color:var(--blue-text);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.side .tab.on .cnt{background:#60A5FA;color:#0B0D12}
.dmain > .panel{display:none;margin-bottom:0}
.dmain > .panel.on{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:6px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--paper);display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--navy)}
.tile.sm b{font-size:19px;line-height:1.25;letter-spacing:-.01em}

.tile b{font-family:"Inter Tight",Inter,sans-serif;font-size:34px;letter-spacing:-.03em;line-height:1}
.tile span{color:var(--muted);font-size:14px}
.tile.warn{background:#FEF3C7;border-color:#FCD34D}
@media (max-width:900px){
  .dash{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;overflow-x:auto;padding:8px;gap:6px}
  .side .tab{white-space:nowrap;padding:9px 12px;font-size:14px}
}
</style>

const MY_TZ_SHORT = (new Intl.DateTimeFormat("en-CA", { timeZoneName: "short" }).formatToParts(new Date()).find((p) => p.type === "timeZoneName") || {}).value || "";
function gcalLink(slot, who) {

  const u = new URL("https://calendar.google.com/calendar/render");
  u.searchParams.set("action", "TEMPLATE");
  u.searchParams.set("text", `Avelon class: ${who}`);
  u.searchParams.set("dates", `${f(zparts(t, slot.timezone))}/${f(zparts(t + slot.minutes * 60000, slot.timezone))}`);
  u.searchParams.set("ctz", slot.timezone);
  u.searchParams.set("recur", "RRULE:FREQ=WEEKLY");

async function loadSF() {

      <td>${s.meet_link ? `<a class="btnlink${live ? " go" : ""}" href="${esc(s.meet_link)}" target="_blank" rel="noopener">Join Google Meet</a>` : `<span class="note">Meet link coming</span>`}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}

    ${s.meet_link ? `<a href="${esc(s.meet_link)}" target="_blank" rel="noopener">Google Meet link</a>` : `<span class="note">No Meet link yet</span>`} · <a href="${esc(gcalLink(s, k.first_name))}" target="_blank" rel="noopener">Add to Google Calendar</a>
    ${canEdit ? `<div class="actions" style="margin-top:6px"><button class="small" data-editlink="${s.id}" data-link="${esc(s.meet_link || "")}" type="button">${s.meet_link ? "Change" : "Add"} Meet link</button><button class="small" data-delslot="${s.id}" type="button">Remove</button></div>` : ""}</li>`).join("");

      <label>Google Meet link <span class="note">(optional now, you can add it later)</span><input name="meet_link" type="url" placeholder="https://meet.google.com/abc-defg-hij"></label>

  return `<div class="block"><h3>Weekly schedule</h3>${rows ? `<ul class="plain">${rows}</ul>` : `<p class="note">No class time set yet.</p>`}${form}</div>`;
}
const FILE_NOTE = `<div class="msg info" style="margin:8px 0 12px;font-size:14px">Files are deleted automatically 3 months after upload. Download anything you want to keep.</div>`;
function filesHtml(k, files, me) {
  const mine = files.filter((f) => f.student_id === k.id);

const dashTabs = {};
function dash(sections, body) {

}
function tiles(list) {
  return `<div class="tiles">${list.map(([id, num, label, warn, small]) => `<button type="button" class="tile${warn ? " warn" : ""}${small ? " sm" : ""}" data-tab="${id}"><b>${num}</b><span>${label}</span></button>`).join("")}</div>`;
}
function bindDash(role, def) {
  const pick = (id) => {
    dashTabs[role] = id;
    app.querySelectorAll(".dmain > .panel").forEach((p) => p.classList.toggle("on", p.id === id));
    app.querySelectorAll(".side .tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === id));

  return best ? new Date(best.t).toLocaleString("en-CA", { weekday: "short", hour: "numeric", minute: "2-digit" }) + " · " + esc(byId[best.s.student_id].first_name) : "None yet";

  });

// ---------------- My Avelon (account holders and students with their own login) ----------------
// One view for everyone in a family. The account holder (whoever signed up) also gets
// rates, payments, details and "Add a student". A student signed in with their own email
// gets the same schedule, files and classes, without anything about money.
async function myView(me, own, asStudent) {
  document.body.classList.add("dashmode");
  const holder = own.length > 0 || !asStudent.length;
  const kids = own.concat(asStudent.filter((k) => !own.some((o) => o.id === k.id)));
  const [{ data: classes }, { data: pays }, sf] = await Promise.all([
    sb.from("sessions").select("id, student_id, class_date, minutes, amount_cents, status, trial_number, notes, homework, charge_id").order("class_date", { ascending: false }).limit(100),
    holder ? sb.from("charges").select("*").order("created_at", { ascending: false }).limit(30) : Promise.resolve({ data: [] }),
    loadSF(),
  ]);
  const byId = Object.fromEntries(kids.map((k) => [k.id, k]));
  const isOwn = (k) => k.parent_id === me.id;
  const mine = (classes || []).filter((c) => byId[c.student_id]);
  const doneCount = (id) => mine.filter((c) => c.student_id === id && c.status !== "void").length;
  const pendingCount = mine.filter((c) => c.status === "pending").length;

  const card = me.card_last4
    ? `<p>Card on file: <b>${esc((me.card_brand || "card").toUpperCase())} •••• ${esc(me.card_last4)}</b></p><button id="addcard" type="button">Change card</button>`

  // Notes and homework: the student always sees their own. The account holder sees them too,
  // except for a Grade 6+ student who has their own login (their notes go to them).
  const showNotes = (k) => !isOwn(k) || !(parseInt(String(k.grade || "").replace(/\D/g, ""), 10) >= 6 && !!k.student_email);

  const classRow = (c, withName) => {
    const k = byId[c.student_id] || {};
    let amt = "";
    if (isOwn(k)) {
      amt = money(c.amount_cents);
      if (c.trial_number === 1) amt = "Free (trial)";
      else if ((c.trial_number === 2 || c.trial_number === 3) && k.trial_status !== "continuing") amt = `${money(c.amount_cents)}<br><span class="note">only if you continue</span>`;
      if (c.status === "void") amt = "—";

    const act = c.status === "pending"

    const details = showNotes(k) ? [c.notes && `<b>Covered:</b> ${esc(c.notes)}`, c.homework && `<b>Homework:</b> ${esc(c.homework)}`].filter(Boolean).join("<br>") : "";
    return `<tr><td>${esc(c.class_date)}</td>${withName ? `<td>${esc(k.first_name || "")}</td>` : ""}<td>${c.minutes} min</td>${holder ? `<td>${amt}</td>` : ""}<td>${pill(c.status)}${act ? "<br>" + act : ""}${details ? `<div class="note" style="margin-top:6px">${details}</div>` : ""}</td></tr>`;
  };

         <div class="actions"><button class="small primary" data-trial="continuing" data-id="${k.id}" type="button">Continue with Avelon</button>
         <button class="small" data-trial="ended" data-id="${k.id}" type="button">Stop after the trial</button></div>` : "";

  });
  app.querySelectorAll("[data-ok]").forEach((b) => b.onclick = async () => {
    try { await rpc("review_session", { p_session: b.dataset.ok, p_action: "approve" }); show("Class confirmed. Thank you!"); }
    catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-flag]").forEach((b) => b.onclick = async () => {
    const r = prompt("What went wrong? (for example: the class didn't happen)");
    if (!r) return;
    try { await rpc("review_session", { p_session: b.dataset.flag, p_action: "flag", p_reason: r }); show("Thanks for letting us know. We'll look into it and won't charge this class until it's sorted."); }
    catch (err) { show(err.message, "bad"); }
  });
  bindShared(me);
  bindDash("family", "m-overview");
  if (justSaved && !me.card_last4) { justSaved = false; setTimeout(route, 4000); }
}

    <div class="panel" id="t-overview"><h2>Overview</h2>${tiles([["t-week", nextClass(sf.slots, byId), "next class", false, true], ["t-week", weekN, "classes this week"], ["t-students", (kids || []).length, "students"], ["t-recent", waiting, "waiting for family to confirm"], ["t-recent", flagged, "flagged by a family", flagged > 0]])}
      <button class="primary" type="button" data-tab="t-log" style="margin-top:18px">Log a class</button></div>
    <div class="panel" id="t-week"><h2>Your week</h2>${upcomingHtml(sf.slots, byId, { days: 7, empty: "No classes scheduled this week. Add each student's weekly time below." })}</div>
    <div class="panel" id="t-log"><h2>Log a class</h2>
      ${(kids || []).length ? `<form id="log" class="form">
        <div class="row"><label>Student<select name="student_id" required>${kids.map((k) => `<option value="${k.id}">${esc(k.first_name)} · ${esc(k.grade || "")} ${esc(k.subject || "")}</option>`).join("")}</select></label>
        <label>Date<input name="class_date" type="date" value="${today()}" max="${today()}" required></label>
        <label>Length<select name="minutes"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>60 min</option><option value="75">75 min</option><option value="90">90 min</option><option value="120">120 min</option></select></label></div>
        <p class="note" style="margin:-4px 0 0">Classes are charged at the booked length from the student's weekly time, even if you run over. Length only matters for students with no weekly time set.</p>
        <label>What you covered <span class="note" style="font-weight:400">(goes into the student's weekend report)</span><textarea name="notes" required placeholder="e.g. Fractions: adding with different denominators. Good progress."></textarea></label>
        <label>Homework <span class="note" style="font-weight:400">(listed under "To practise next")</span><textarea name="homework" placeholder="e.g. Worksheet questions 1–10"></textarea></label>
        <button class="primary" type="submit">Log class and send confirmation</button></form>` : `<p class="note">No students assigned to you yet.</p>`}
    </div>
    <div class="panel" id="t-students"><h2>Your students</h2>${(kids || []).map((k) => `<details class="kidbox"><summary><b>${esc(k.first_name)}</b> <span class="note">${esc([k.grade, k.subject].filter(Boolean).join(" · "))}</span></summary>${slotsHtml(k, sf.slots, true)}${filesHtml(k, sf.files, me)}</details>`).join("") || `<p class="note">No students assigned to you yet.</p>`}</div>
    <div class="panel" id="t-details"><h2>Your details</h2>
        <form id="tme" class="form"><div class="row"><label>Name<input name="full_name" value="${esc(me.full_name)}" required></label><label>Phone<input name="phone" value="${esc(me.phone)}"></label></div>
        <p class="note" style="margin:0">Email: ${esc(me.email)}</p><button class="small" type="submit">Save</button></form></div>
    <div class="panel" id="t-recent"><h2>Your recent classes</h2><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Student</th><th>Length</th><th>Status</th></tr></thead><tbody>${rows || `<tr><td colspan="4" class="note">No classes yet.</td></tr>`}</tbody></table></div></div>`)}`;
  flash = "";
  bindShared(me);
  bindDash("tutor", "t-overview");
  document.getElementById("tme").onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    const { error } = await sb.from("profiles").update({ full_name: f.get("full_name"), phone: f.get("phone") }).eq("id", me.id);
    show(error ? error.message : "Saved.", error ? "bad" : "ok");
  };
  const form = document.getElementById("log");
  if (form) form.onsubmit = async (e) => {
    e.preventDefault(); const btn = form.querySelector("button"); btn.disabled = true;
    try { await call("log-session", Object.fromEntries(new FormData(form))); show("Class logged. The family has been asked to confirm."); }
    catch (err) { btn.disabled = false; show(err.message, "bad"); }
  };
}

// ---------------- Admin ----------------
async function adminView(me) {
  document.body.classList.add("dashmode");
  const [{ data: people }, { data: kids }, { data: classes }, { data: pays }, { data: reqs }, sf, { data: usage }] = await Promise.all([
    sb.from("profiles").select("id, email, full_name, phone, role, card_last4, created_at").order("created_at", { ascending: false }),
    sb.from("students").select("*").order("created_at", { ascending: false }),
    sb.from("sessions").select("id, student_id, tutor_id, class_date, minutes, amount_cents, status, flag_reason, trial_number, charge_id").order("class_date", { ascending: false }).limit(200),
    sb.from("charges").select("*").order("created_at", { ascending: false }).limit(50),
    sb.from("trial_requests").select("id, created_at, parent_name, email, grade, subject, status").order("created_at", { ascending: false }).limit(50),
    loadSF(),
    sb.rpc("usage_report"),
  ]);
  const { data: unbilled } = await sb.from("sessions").select("id, student_id, amount_cents, status, trial_number").eq("status", "approved").is("charge_id", null).gt("amount_cents", 0);
  const { data: reports } = await sb.from("weekend_reports").select("student_id, week_start, sent_to, class_count, sent_at").order("sent_at", { ascending: false }).limit(20);
  const P = Object.fromEntries((people || []).map((p) => [p.id, p]));
  const K = Object.fromEntries((kids || []).map((k) => [k.id, k]));
  const tutors = (people || []).filter((p) => p.role === "tutor");
  const parents = (people || []).filter((p) => p.role === "parent");
  const admins = (people || []).filter((p) => p.role === "admin");
  const open = (classes || []).filter((c) => c.status === "flagged" || c.status === "pending");
  const who = (p) => esc(p?.full_name || p?.email || "");
  const roleSel = (p) => `<select data-role="${p.id}" style="width:auto">${["parent", "tutor", "admin"].map((r) => `<option ${r === p.role ? "selected" : ""}>${r}</option>`).join("")}</select>`;

  // Trial requests
  const reqRows = (reqs || []).map((r) => `<tr><td>${new Date(r.created_at).toLocaleDateString("en-CA")}</td><td><b>${esc(r.parent_name)}</b><div class="note"><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></div></td><td>${esc(r.grade)}<div class="note">${esc(r.subject)}</div></td>
    <td><select data-req="${r.id}" style="width:auto">${["new", "contacted", "booked", "closed"].map((x) => `<option ${x === r.status ? "selected" : ""}>${x}</option>`).join("")}</select></td>
    <td style="white-space:nowrap">${r.status === "booked" || r.status === "closed"
      ? `<button class="small" type="button" data-delreq="${r.id}" title="Remove this request" aria-label="Remove this request">✕ Remove</button>`
      : `<button class="small primary" type="button" data-setup="${r.id}">Set up family</button>`}</td></tr>`).join("");
  const newReqs = (reqs || []).filter((r) => r.status === "new").length;

  // Classes needing attention
  const openRows = open.map((c) => `<tr><td>${esc(c.class_date)}</td><td>${esc(K[c.student_id]?.first_name || "")}</td><td>${who(P[c.tutor_id])}</td><td>${c.minutes} min · ${money(c.amount_cents)}</td>
    <td>${pill(c.status)}${c.flag_reason ? `<div class="note">${esc(c.flag_reason)}</div>` : ""}<div class="actions" style="margin-top:6px"><button class="small" data-set="approved" data-id="${c.id}" type="button">Approve</button><button class="small" data-set="void" data-id="${c.id}" type="button">Don't charge</button></div></td></tr>`).join("");

  // Students
  const groups = {};
  for (const k of kids || []) if (k.open_to_group && k.active) (groups[`${k.grade || "?"} · ${k.subject || "?"}`] ||= []).push(k.first_name);
  const matchable = Object.entries(groups).filter(([, n]) => n.length >= 2);
  const kidRows = (kids || []).map((k) => `<tr data-kid="${k.id}">
    <td><b>${esc(k.first_name)}</b>${k.open_to_group ? ' <span class="pill blue">Open to group</span>' : ""}<div class="note">${esc(k.grade || "")} · ${esc(k.subject || "")}<br>Parent: ${who(P[k.parent_id])}${P[k.parent_id]?.card_last4 ? " · card ✓" : " · no card"}${k.student_email ? `<br>Student email: ${esc(k.student_email)}` : ""}</div></td>
    <td><select name="tutor"><option value="">none</option>${tutors.map((t) => `<option value="${t.id}" ${t.id === k.tutor_id ? "selected" : ""}>${esc(t.full_name || t.email)}</option>`).join("")}</select></td>
    <td><input name="rate" type="number" min="0" step="0.5" style="width:96px" value="${k.rate_cents != null ? (k.rate_cents / 100) : ""}" placeholder="$/hr"></td>
    <td><select name="trial">${["trial", "continuing", "ended"].map((t) => `<option ${t === k.trial_status ? "selected" : ""}>${t}</option>`).join("")}</select></td>

  const tutorRows = tutors.concat(admins.filter((a) => (kids || []).some((k) => k.tutor_id === a.id))).map((t) => {

      <td>${st.map((k) => `${esc(k.first_name)} <span class="note">(${esc(k.grade || "")} ${esc(k.subject || "")})</span>`).join("<br>") || '<span class="note">no students yet</span>'}</td><td>${roleSel(t)}</td></tr>`;

  const bar = (used, total, label) => { const pct = Math.min(100, Math.round((used / total) * 100)); return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${label}</span><span>${(used / 1048576).toFixed(0)} MB of ${total >= 1073741824 ? "1 GB" : (total / 1048576) + " MB"} · <b>${pct}%</b></span></div><div style="height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px"><div style="height:100%;width:${Math.max(pct, 1)}%;background:${pct >= 75 ? "var(--warn)" : "var(--navy)"}"></div></div></div>`; };
  const usageHtml = usage ? bar(usage.db_bytes, 500 * 1048576, "Database") + bar(usage.file_bytes, 1073741824, `Class files (${usage.file_count})`) : `<p class="note">Couldn't load usage.</p>`;

    <div class="panel" id="week"><h2>This week</h2>${upcomingHtml(sf.slots, K, { days: 7, empty: "No classes scheduled this week.", extra: (k) => "Tutor: " + (who(P[k.tutor_id]) || "none") })}</div>
    <div class="panel" id="attention"><h2>Classes needing attention (${open.length})</h2><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Student</th><th>Tutor</th><th>Class</th><th>Status</th></tr></thead><tbody>${openRows || `<tr><td colspan="5" class="note">Nothing to review.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="students"><h2>Students (${(kids || []).length})</h2><p class="note">Set the tutor and hourly price for each student. Tutors can only log classes once both are set. Founding families (first 10): $25/hour one-on-one; small group and Bangla: $20/hour.</p>
      ${matchable.length ? `<div class="msg info">Possible small groups: ${matchable.map(([g, n]) => `<b>${esc(g)}</b> (${n.map(esc).join(", ")})`).join("; ")}</div>` : ""}
      <div class="scroll"><table class="table"><thead><tr><th>Student</th><th>Tutor</th><th>$/hour</th><th>Trial</th><th>Active</th><th></th></tr></thead><tbody>${kidRows || `<tr><td colspan="6" class="note">No students yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="schedules"><h2>Schedules &amp; files</h2><p class="note">Set each student's weekly class time and Google Meet link. The family, the student and the tutor all see it.</p>
      ${(kids || []).filter((k) => k.active).map((k) => `<details class="kidbox"><summary><b>${esc(k.first_name)}</b> <span class="note">${esc([k.grade, k.subject].filter(Boolean).join(" · "))} · tutor: ${who(P[k.tutor_id]) || "none"} · ${sf.slots.filter((s) => s.student_id === k.id).length} weekly class(es)</span></summary>${slotsHtml(k, sf.slots, true)}${filesHtml(k, sf.files, me)}</details>`).join("") || `<p class="note">No students yet.</p>`}</div>

        <div class="row"><label>Parent/guardian name<input name="full_name" required></label><label>Their email<input name="email" type="email" required></label></div>
        <div class="row"><label>Student's first name<input name="student_first_name" required></label>

    <div class="panel" id="parents"><h2>Parents (${parents.length})</h2><p class="note">Families you add, plus anyone who signs in on their own. Your own account appears here too if you sign in with another email for testing.</p><div class="scroll"><table class="table"><thead><tr><th>Parent</th><th>Children</th><th>Card</th><th>Role</th></tr></thead><tbody>${parentRows || `<tr><td colspan="4" class="note">No parents yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="reports"><h2>Weekend reports</h2><p class="note">Every Saturday morning, each student with classes that week gets one email to the email on file (the student's own email if added, otherwise the parent's): what was covered, from the tutor's class notes, and what to practise. Students with no classes that week get nothing.</p>
      <button id="previewreports" type="button">Email me a preview of this week's reports</button>
      <h3 style="margin-top:22px">Recently sent</h3><div class="scroll"><table class="table"><thead><tr><th>Week of</th><th>Student</th><th>Sent to</th><th>Classes</th></tr></thead><tbody>${(reports || []).map((r) => `<tr><td>${esc(r.week_start)}</td><td>${esc(K[r.student_id]?.first_name || "")}</td><td>${esc(r.sent_to)}</td><td>${r.class_count}</td></tr>`).join("") || `<tr><td colspan="4" class="note">None sent yet. The first ones go out on Saturday.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="billing"><h2>Billing</h2><p class="note">Every Monday, each family is charged automatically for their confirmed classes that haven't been charged yet. Only families listed below have anything to charge. To charge some now (for example after a family fixes a failed card), tick them and press Charge selected.</p>
      ${readyRows ? `<div class="scroll"><table class="table"><thead><tr><th style="width:36px"><input type="checkbox" id="billall" checked aria-label="Select all"></th><th>Family</th><th>Classes</th><th>Amount</th><th>Card</th></tr></thead><tbody>${readyRows}</tbody></table></div>
      <button id="bill" class="primary" type="button" style="margin-top:14px">Charge selected</button>` : `<p class="note"><b>Nothing to charge right now.</b></p>`}
      ${waitingConfirm ? `<p class="note">${waitingConfirm} more ${waitingConfirm === 1 ? "class is" : "classes are"} waiting for the family to confirm (auto-confirmed after 24 hours).</p>` : ""}
      <h3 style="margin-top:26px">Payments</h3><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Parent</th><th>Amount</th><th>Status</th></tr></thead><tbody>${payRows || `<tr><td colspan="4" class="note">No payments yet.</td></tr>`}</tbody></table></div></div>
    <div class="panel" id="storage"><h2>Storage</h2>${usageHtml}<p class="note">Free plan limits. Class files are deleted automatically 3 months after upload. If either bar passes 75%, you'll get an email on Monday.</p></div>
    </div></div>`;
  flash = "";

  const pick = (id) => {
    adminTab = id;
    app.querySelectorAll(".dmain > .panel").forEach((p) => p.classList.toggle("on", p.id === id));
    app.querySelectorAll(".side .tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === id));
  };
  app.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { pick(b.dataset.tab); if (innerWidth < 900) app.querySelector(".dmain").scrollIntoView({ behavior: "smooth" }); });
  pick(app.querySelector(`#${adminTab}`) ? adminTab : "overview");
  document.getElementById("previewreports").onclick = async (e) => {
    e.target.disabled = true;
    try { const r = await call("weekend-report", { preview: true }); show(r.note || (r.sent.length ? `Sent ${r.sent.length} preview(s) to your inbox. Nothing was sent to families.` : "No reports to preview.")); }
    catch (err) { show(err.message, "bad"); }
  };
  const billBtn = document.getElementById("bill");
  const billAll = document.getElementById("billall");
  if (billAll) billAll.onchange = () => app.querySelectorAll("[data-billfam]").forEach((x) => { x.checked = billAll.checked; });
  if (billBtn) billBtn.onclick = async (e) => {
    const picked = [...app.querySelectorAll("[data-billfam]:checked")];
    if (!picked.length) return show("Tick at least one family to charge.", "bad");
    const total = picked.reduce((a, x) => a + Number(x.dataset.amt), 0);
    if (!confirm(`Charge ${picked.length} ${picked.length === 1 ? "family" : "families"} a total of ${money(total)} now?`)) return;
    e.target.disabled = true;
    try { const r = await call("weekly-billing", { parent_ids: picked.map((x) => x.dataset.billfam) }); show(`Charged ${r.charged.length}, failed ${r.failed.length}, no card ${r.noCard.length}.`); }
    catch (err) { e.target.disabled = false; show(err.message, "bad"); }
  };
  app.querySelectorAll("[data-set]").forEach((b) => b.onclick = async () => {
    try { await rpc("admin_set_session", { p_session: b.dataset.id, p_status: b.dataset.set }); show("Updated."); }
    catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-savekid]").forEach((b) => b.onclick = async () => {
    const tr = b.closest("tr"); const g = (n) => tr.querySelector(`[name=${n}]`);
    const rate = g("rate").value === "" ? null : Math.round(Number(g("rate").value) * 100);
    try { await rpc("admin_update_student", { p_student: tr.dataset.kid, p_tutor: g("tutor").value || null, p_rate_cents: rate, p_trial_status: g("trial").value, p_active: g("active").checked }); show("Student saved."); }
    catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-req]").forEach((sel) => sel.onchange = async () => {
    const { error } = await sb.from("trial_requests").update({ status: sel.value }).eq("id", sel.dataset.req);
    show(error ? error.message : "Request updated.", error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-delreq]").forEach((b) => b.onclick = async () => {
    if (!confirm("Remove this trial request? This can't be undone.")) return;
    const { error } = await sb.from("trial_requests").delete().eq("id", b.dataset.delreq);
    show(error ? error.message : "Request removed.", error ? "bad" : "ok");
  });
  app.querySelectorAll("[data-setup]").forEach((b) => b.onclick = () => {
    const r = (reqs || []).find((x) => x.id === b.dataset.setup); const f = document.getElementById("addfam");
    f.request_id.value = r.id; f.full_name.value = r.parent_name || ""; f.email.value = r.email || "";
    f.student_first_name.value = ""; if (r.grade) f.grade.value = r.grade; if (SUBJECTS.includes(r.subject)) f.subject.value = r.subject;
    app.querySelector('.side [data-tab="people"]').click(); f.student_first_name.focus();
  });
  const addPerson = (id, kind) => { const f = document.getElementById(id); f.onsubmit = async (e) => {
    e.preventDefault(); const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
    const d = Object.fromEntries(new FormData(f)); d.kind = kind; d.send_email = !!f.send_email.checked;
    try { await call("add-person", d); show(kind === "tutor" ? `${d.full_name} is now a tutor.${d.send_email ? " Welcome email sent." : ""}` : `${d.student_first_name} added under ${d.full_name}.${d.send_email ? " They've been emailed." : ""}`); }
    catch (err) { btn.disabled = false; show(err.message, "bad"); }
  }; };
  addPerson("addfam", "family"); addPerson("addtutor", "tutor");
  app.querySelectorAll("[data-rename]").forEach((b) => b.onclick = async () => {
    const n = prompt("New name:", b.dataset.name || ""); if (n == null || !n.trim()) return;
    try { await rpc("admin_set_name", { p_user: b.dataset.rename, p_name: n.trim() }); show("Name updated."); }
    catch (err) { show(err.message, "bad"); }
  });
  app.querySelectorAll("[data-role]").forEach((s) => s.onchange = async () => {
    if (s.value === "admin" && !confirm("Give this person full admin access, including all families and payments?")) { route(); return; }
    try { await rpc("admin_set_role", { p_user: s.dataset.role, p_role: s.value }); show("Role updated."); }
    catch (err) { show(err.message, "bad"); }
  });
  bindShared(me);
}

// ---------------- Router ----------------
async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: me, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !me) { app.innerHTML = `<div class="msg bad">Couldn't load your account. Try signing out and in again.</div>`; return; }
  document.getElementById("who").textContent = me.email;
  const so = document.getElementById("signout"); so.classList.remove("hidden");
  so.onclick = async () => { await sb.auth.signOut(); loginView(); };
  try {
    if (me.role === "admin") await adminView(me);
    else if (me.role === "tutor") await tutorView(me);
    else {
      const { data: linked } = await sb.from("students").select("*");
      const own = (linked || []).filter((k) => k.parent_id === me.id), asStudent = (linked || []).filter((k) => k.parent_id !== me.id);
      await myView(me, own, asStudent);
    }
  } catch (err) { app.innerHTML = `<div class="msg bad">${esc(err.message)}</div>`; }
}
sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT") route(); });
route();
</script>
</body>
</html>
